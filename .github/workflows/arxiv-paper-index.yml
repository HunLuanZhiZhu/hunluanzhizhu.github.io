name: Build arXiv paper index
on:
  push:
    branches: [main]
    paths:
      - 'projects/arxiv-insights/papers/**/index.html'
      - 'projects/arxiv-insights/tools/build_paper_index.py'
      - '.github/workflows/arxiv-paper-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-paper-index-main
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index from HTML
        run: python projects/arxiv-insights/tools/build_paper_index.py
      - name: Commit generated index only when changed
        run: |
          if git diff --quiet -- projects/arxiv-insights/data/papers.json; then
            echo "Index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- projects/arxiv-insights/data/papers.json
          git commit -m "Generate arXiv paper index from HTML metadata"
          git pull --rebase origin main
          git push origin HEAD:main
