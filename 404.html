<style>
  :root{
    --acid:#c6ff00;--acid-34:rgba(198,255,0,.34);--acid-16:rgba(198,255,0,.16);
    --ground:#000;--hairline:rgba(255,255,255,.13);--hairline-2:rgba(255,255,255,.065);
    --ink:#fffef4;--ink-2:#8f8f8f;--ink-3:#4e4e4e;
    --mono:'Cascadia Mono Subset','JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code','Liberation Mono',Menlo,Consolas,monospace;
    --cjk:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--ground);color-scheme:dark}
  body{
    font-family:var(--mono),var(--cjk);background:var(--ground);color:var(--ink);
    min-height:100vh;line-height:1.62;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;padding:clamp(20px,5vw,64px);
  }
  ::selection{background:var(--acid);color:#000}
  .box{width:100%;max-width:760px;margin:0 auto}
  .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);
     margin-bottom:24px;display:flex;align-items:center;gap:10px}
  .k i{width:16px;height:1px;background:var(--acid);display:block}
  h1{
    font-size:clamp(2.25rem,1rem+6.4vw,5.5rem);line-height:.98;letter-spacing:-.035em;
    font-weight:700;margin-bottom:20px;
  }
  h1 em{font-style:normal;color:var(--acid)}
  .path{
    font-size:13px;color:var(--ink-2);border:1px solid var(--hairline);
    padding:12px 16px;margin:24px 0;word-break:break-all;
  }
  .path b{color:var(--ink);font-weight:700}
  p.lede{font-size:13px;color:var(--ink-2);max-width:56ch}
  nav{display:flex;flex-wrap:wrap;gap:8px 32px;margin-top:36px;
      border-top:1px solid var(--hairline-2);padding-top:24px}
  a{
    color:var(--ink);min-height:44px;display:inline-flex;align-items:center;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
    border-bottom:1px solid transparent;
    transition:color 170ms cubic-bezier(.65,0,.45,1),border-color 170ms cubic-bezier(.65,0,.45,1);
  }
  a:hover,a:focus-visible{color:var(--acid);border-bottom-color:var(--acid-34)}
  a.home{color:var(--acid)}
  a.home:hover{border-bottom-color:var(--acid)}
  :focus-visible{outline:2px solid var(--acid);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
