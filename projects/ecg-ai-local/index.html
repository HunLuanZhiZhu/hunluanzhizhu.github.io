<style>
  /* ===== H5 壳层样式（导航栏/TabBar挂载点/UI组件） ===== */
  html, body { margin: 0; padding: 0; height: 100%; }
  body { background: #F5F5F7; }
  body.dark { background: #0B1120; }

  /* 顶部导航栏 */
  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    background: rgba(245, 245, 247, 0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(60, 60, 67, 0.12);
  }
  body.dark .nav-bar {
    background: rgba(11, 17, 32, 0.85);
    border-bottom-color: rgba(84, 84, 88, 0.45);
  }
  .nav-bar-title {
    font-size: 17px;
    font-weight: 600;
    color: #1D1D1F;
    letter-spacing: -0.2px;
  }
  body.dark .nav-bar-title { color: #F1F5F9; }
  .nav-bar-back {
    position: absolute;
    left: 10px;
    font-size: 15px;
    color: #007AFF;
    background: none;
    border: none;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 8px;
  }
  .nav-bar-back:active { opacity: 0.6; }

  /* 页面挂载点 */
  #page-root { min-height: calc(100vh - 44px); }

  /* TabBar 挂载点 */
  #tabbar-root {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 950;
  }

  /* ===== UI 组件（toast/loading/modal/actionsheet） ===== */
  .ui-toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: rgba(28, 28, 30, 0.88);
    color: #fff;
    border-radius: 12px;
    padding: 14px 22px;
    display: flex; align-items: center; gap: 8px;
    font-size: 14px;
    z-index: 99999;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    max-width: 80vw;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .ui-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .ui-toast-icon {
    width: 20px; height: 20px; border-radius: 50%;
    background: #34C759; color: #fff;
    font-size: 12px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-weight: 700;
  }
  .ui-loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(0, 0, 0, 0.35);
    z-index: 99998;
    opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
  }
  .ui-loading.show { opacity: 1; pointer-events: auto; }
  .ui-loading-spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: ui-spin 0.9s linear infinite;
  }
  .ui-loading-text { color: #fff; font-size: 14px; }
  @keyframes ui-spin { to { transform: rotate(360deg); } }
  .ui-modal { position: fixed; inset: 0; z-index: 99997; }
  .ui-modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.25s ease; }
  .ui-modal.show .ui-modal-mask { opacity: 1; }
  .ui-modal-box {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -46%) scale(0.94);
    width: min(320px, 86vw);
    background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    opacity: 0; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s ease;
  }
  body.dark .ui-modal-box { background: #1E293B; }
  .ui-modal.show .ui-modal-box { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .ui-modal-title { padding: 18px 16px 0; font-size: 17px; font-weight: 600; text-align: center; color: #1D1D1F; }
  body.dark .ui-modal-title { color: #F1F5F9; }
  .ui-modal-content { padding: 10px 20px 18px; font-size: 14px; color: #6E6E73; text-align: center; line-height: 1.6; }
  body.dark .ui-modal-content { color: #94A3B8; }
  .ui-modal-actions { display: flex; border-top: 0.5px solid rgba(60,60,67,0.12); }
  .ui-modal-btn { flex: 1; padding: 12px 0; background: none; border: none; font-size: 17px; cursor: pointer; color: #007AFF; }
  .ui-modal-btn + .ui-modal-btn { border-left: 0.5px solid rgba(60,60,67,0.12); }
  .ui-modal-btn:active { opacity: 0.6; }
  .ui-sheet { position: fixed; inset: 0; z-index: 99996; }
  .ui-sheet-mask { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.25s ease; }
  .ui-sheet.show .ui-sheet-mask { opacity: 1; }
  .ui-sheet-panel { position: absolute; left: 8px; right: 8px; bottom: 8px; transform: translateY(105%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); }
  .ui-sheet.show .ui-sheet-panel { transform: translateY(0); }
  .ui-sheet-list { background: #fff; border-radius: 14px; overflow: hidden; }
  body.dark .ui-sheet-list { background: #1E293B; }
  .ui-sheet-item { display: block; width: 100%; padding: 15px 0; background: none; border: none; font-size: 17px; color: #007AFF; cursor: pointer; border-bottom: 0.5px solid rgba(60,60,67,0.12); }
  .ui-sheet-item:last-child { border-bottom: none; }
  .ui-sheet-cancel { display: block; width: 100%; margin-top: 8px; padding: 15px 0; background: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; color: #1D1D1F; cursor: pointer; }
  body.dark .ui-sheet-cancel { background: #1E293B; color: #F1F5F9; }
</style>
