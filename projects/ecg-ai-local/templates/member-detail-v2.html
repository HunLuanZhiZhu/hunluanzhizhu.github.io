<div class="container {{theme === 'dark' ? 'dark' : ''}}"><div class="card member-hero fade-in-up"><img class="member-hero-avatar-img pop-in avatar-lg" src="{{member.avatar}}" mode="aspectFill"></img><div class="member-hero-name">{{member.name}}</div><div class="member-hero-role {{member.role === '团队总负责人' ? 'role-leader' : 'role-member'}}">{{member.role}}</div></div><div class="card fade-in-up-d1"><div class="detail-section"><div class="sec sec-inline-sm"><div class="sec-title">学历背景</div></div><div class="info-section-text">{{member.education}}</div></div><div class="divider"></div><div class="detail-section"><div class="sec sec-inline-sm"><div class="sec-title">研究方向</div></div><div class="info-section-text">{{member.research}}</div></div><div class="divider"></div><div class="detail-section"><div class="sec sec-inline-sm"><div class="sec-title">项目职责</div></div><div class="info-section-text">{{member.responsibility}}</div></div></div><div class="card fade-in-up-d2" data-wx-if="{{member.achievements &amp;&amp; member.achievements.length > 0}}"><div class="sec sec-inline-lg"><div class="sec-title">研究成果</div></div><div class="achievement-tags"><div class="achievement-tag" data-wx-for="{{member.achievements}}" data-wx-key="*this">{{item}}</div></div></div><div class="footer-text">心韵深辨 · 用心感知，以智辨析</div></div>
