<div class="container {{theme === 'dark' ? 'dark' : ''}}"><div class="reading-progress" style="width:{{progressPercent}}%;"></div><div class="card info-hero fade-in-up"><div class="info-hero-icon pop-in">{{info.icon || '内'}}</div><div class="info-hero-title">{{info.title}}</div></div><div class="card fade-in-up-d1"><div data-wx-for="{{info.sections}}" data-wx-key="title"><div class="sec sec-inline-sm"><div class="sec-title">{{item.title}}</div></div><div class="info-section-text">{{item.content}}</div><div class="info-divider" data-wx-if="{{index < info.sections.length - 1}}"></div></div></div><div class="sec" data-wx-if="{{relatedArticles.length > 0}}"><div class="sec-title">相关阅读</div></div><div class="related-scroll" scroll-x="" data-wx-if="{{relatedArticles.length > 0}}"><div class="related-card" data-wx-for="{{relatedArticles}}" data-wx-key="id" data-id="{{item.id}}" data-bind="tap:onRelatedTap"><div class="related-title">{{item.title}}</div><div class="related-cta">阅读文章 ›</div></div></div><div class="footer-text">心韵深辨 · 用心感知，以智辨析</div></div>
