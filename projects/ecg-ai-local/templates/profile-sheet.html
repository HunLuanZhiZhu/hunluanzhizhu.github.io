<div class="mask {{visible ? 'show' : ''}} {{theme === 'dark' ? 'dark' : ''}}" data-bind="tap:onMaskTap"><div class="sheet {{visible ? 'show' : ''}}" data-bind="catch:noop"><div class="grabber"></div><div class="sheet-header"><div class="sheet-title">{{isFirstTime ? '完善个人档案' : '编辑个人档案'}}</div><div class="sheet-desc">心韵深辨会结合您的个人条件，对心电检测结果进行更精准的综合研判，提供更具针对性的健康参考建议。</div></div><div class="tab-bar"><div class="tab-item {{activeTab === 0 ? 'tab-active' : ''}}" data-bind="tap:onTabTap" data-tab="0">基础信息</div><div class="tab-item {{activeTab === 1 ? 'tab-active' : ''}}" data-bind="tap:onTabTap" data-tab="1">过敏史</div><div class="tab-item {{activeTab === 2 ? 'tab-active' : ''}}" data-bind="tap:onTabTap" data-tab="2">慢性疾病</div></div><div class="form" data-wx-if="{{activeTab === 0}}"><div class="form-item"><div class="form-label">姓名<span class="form-optional">选填</span></div><input class="form-input" placeholder="请输入您的姓名" value="{{form.name}}" data-bind="input:onNameInput" maxlength="20"></input></div><div class="form-item"><div class="form-label">性别</div><div class="seg-control"><div class="seg-item {{form.gender === 'male' ? 'seg-active' : ''}}" data-bind="tap:onGenderTap" data-val="male">男</div><div class="seg-item {{form.gender === 'female' ? 'seg-active' : ''}}" data-bind="tap:onGenderTap" data-val="female">女</div></div></div><div class="form-item"><div class="form-label">年龄段</div><div class="seg-control seg-control-multi"><div data-wx-for="{{ageRanges}}" data-wx-key="*this" class="seg-item {{form.ageRange === item ? 'seg-active' : ''}}" data-bind="tap:onAgeTap" data-val="{{item}}">{{item}}</div></div></div></div><div class="form" data-wx-if="{{activeTab === 1}}"><div class="form-item"><div class="toggle-row"><div class="form-label">是否有过敏史</div><div class="toggle-switch {{form.hasAllergies ? 'toggle-on' : ''}}" data-bind="tap:onAllergyToggle"><div class="toggle-knob"></div></div></div></div><div class="form-item"><div class="form-label">食物过敏</div><input class="form-input" placeholder="如：海鲜、花生、牛奶等" value="{{form.foodAllergies}}" data-bind="input:onFoodAllergyInput" maxlength="100"></input></div><div class="form-item"><div class="form-label">药物过敏</div><input class="form-input" placeholder="如：青霉素、阿司匹林等" value="{{form.drugAllergies}}" data-bind="input:onDrugAllergyInput" maxlength="100"></input></div><div class="form-item"><div class="form-label">其他过敏<span class="form-optional">选填</span></div><input class="form-input" placeholder="如：花粉、尘螨等" value="{{form.otherAllergies}}" data-bind="input:onOtherAllergyInput" maxlength="100"></input></div><div class="empty-hint" data-wx-if="{{!form.hasAllergies}}"><div class="empty-hint-icon">✓</div><div class="empty-hint-text">暂无过敏史</div></div></div><div class="form" data-wx-if="{{activeTab === 2}}"><div class="form-item"><div class="toggle-row"><div class="form-label">是否有慢性疾病</div><div class="toggle-switch {{form.hasChronicDisease ? 'toggle-on' : ''}}" data-bind="tap:onChronicToggle"><div class="toggle-knob"></div></div></div></div><div class="form-item"><div class="form-label">选择慢性疾病</div><div class="checkbox-grid"><div data-wx-for="{{chronicOptions}}" data-wx-key="*this" class="checkbox-item {{form.chronicDiseases.indexOf(item) > -1 ? 'checkbox-checked' : ''}}" data-bind="tap:onChronicItemTap" data-disease="{{item}}">{{item}}</div></div></div><div class="form-item"><div class="form-label">其他<span class="form-optional">选填</span></div><input class="form-input" placeholder="请输入其他慢性疾病" value="{{form.chronicOther}}" data-bind="input:onChronicOtherInput" maxlength="50"></input></div><div class="empty-hint" data-wx-if="{{!form.hasChronicDisease}}"><div class="empty-hint-icon">✓</div><div class="empty-hint-text">暂无慢性疾病</div></div></div><div class="sheet-actions"><div class="btn-skip" data-bind="tap:onSkip" data-wx-if="{{isFirstTime}}">跳过</div><div class="btn-save" data-bind="tap:onSave">保存</div></div></div></div>
