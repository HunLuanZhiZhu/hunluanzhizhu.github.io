<div class="tab-bar {{theme === 'dark' ? 'tab-dark' : ''}}"><div class="tab-bar-inner"><div class="tab-item {{selected === index ? 'tab-active' : ''}}" data-wx-for="{{list}}" data-wx-key="index" data-index="{{index}}" data-path="{{item.pagePath}}" data-bind="tap:onTap"><div class="tab-icon-wrap"><span class="tab-icon-text">{{item.iconText}}</span></div><span class="tab-text">{{item.text}}</span></div></div></div>
