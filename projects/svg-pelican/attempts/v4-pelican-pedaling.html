<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(120% 90% at 50% 0%,#eaf7ff 0%,#a9d4ef 45%,#5f93b8 100%);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .stage{width:min(100%,980px)}
  svg{display:block;width:100%;height:auto;border-radius:20px;box-shadow:0 30px 70px rgba(12,40,70,.35)}
  .cap{margin:14px 2px 0;text-align:center;font-size:13.5px;letter-spacing:.06em;color:#0e2a3d;opacity:.72}
  .byline{
    margin:10px auto 0;max-width:660px;display:flex;flex-wrap:wrap;justify-content:center;
    gap:6px 18px;font-size:11.5px;color:#0e2a3d;opacity:.62;letter-spacing:.03em;line-height:1.6;
  }
  .byline b{font-weight:650;color:#b0304c;opacity:.95}
  .byline i{font-style:normal;border-bottom:1px dashed rgba(14,42,61,.3)}

  .cloud,.bird{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
  @keyframes drift{from{transform:translateX(-280px)}to{transform:translateX(1080px)}}

  .puff{animation:puff 1.1s linear infinite;opacity:0}
  @keyframes puff{
    0%  {transform:translate(0,0) scale(.4);opacity:0}
    15% {opacity:.55}
    100%{transform:translate(-64px,-26px) scale(1.5);opacity:0}
  }
  .streak{animation:streak .75s linear infinite}
  @keyframes streak{
    0%  {transform:translateX(46px);opacity:0}
    25% {opacity:.6}
    100%{transform:translateX(-160px);opacity:0}
  }
  @media (prefers-reduced-motion: reduce){
    .cloud,.bird,.puff,.streak{animation:none}
    .puff,.streak{opacity:0}
  }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只鹈鹕骑着红色自行车沿着海边木栈道前进的循环动画">

  <defs>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8fd3f4"/>
      <stop offset="45%"  stop-color="#cdeeff"/>
      <stop offset="100%" stop-color="#fdf3df"/>
    </linearGradient>
    <radialGradient id="gSun">
      <stop offset="0"    stop-color="#fff8cf"/>
      <stop offset="35%"  stop-color="#ffe08a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#49b3da"/>
      <stop offset="100%" stop-color="#93e0f2"/>
    </linearGradient>
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#dcab7b"/>
      <stop offset="100%" stop-color="#b17b49"/>
    </linearGradient>
    <linearGradient id="gPlumage" x1=".25" y1="0" x2=".45" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="62%"  stop-color="#f3f8fc"/>
      <stop offset="100%" stop-color="#d2e0ed"/>
    </linearGradient>
    <linearGradient id="gBeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffc857"/>
      <stop offset="100%" stop-color="#ef8f1c"/>
    </linearGradient>
    <linearGradient id="gPouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffd98f"/>
      <stop offset="100%" stop-color="#f0a03a"/>
    </linearGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="800" height="500" fill="url(#gSky)"/>
  <circle cx="648" cy="86" r="132" fill="url(#gSun)"/>
  <circle cx="648" cy="86" r="42" fill="#ffeaa7"/>

  <g class="cloud" style="animation-duration:58s;animation-delay:-6s" fill="#ffffff" opacity=".92">
    <ellipse cx="0" cy="86" rx="54" ry="21"/>
    <ellipse cx="-38" cy="94" rx="32" ry="15"/>
    <ellipse cx="34" cy="95" rx="36" ry="16"/>
    <ellipse cx="4" cy="70" rx="32" ry="18"/>
  </g>
  <g class="cloud" style="animation-duration:78s;animation-delay:-34s" fill="#ffffff" opacity=".75">
    <ellipse cx="0" cy="150" rx="46" ry="17"/>
    <ellipse cx="-30" cy="156" rx="26" ry="12"/>
    <ellipse cx="28" cy="157" rx="30" ry="13"/>
  </g>
  <g class="cloud" style="animation-duration:96s;animation-delay:-62s" fill="#ffffff" opacity=".6">
    <ellipse cx="0" cy="52" rx="38" ry="13"/>
    <ellipse cx="-26" cy="57" rx="22" ry="10"/>
    <ellipse cx="24" cy="58" rx="24" ry="10"/>
  </g>

  <g class="bird" style="animation-duration:88s;animation-delay:-44s"
     stroke="#3f7196" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M0 126 q 8 -7 16 0 q 8 -7 16 0"/>
    <path d="M70 158 q 6 -5 12 0 q 6 -5 12 0"/>
    <path d="M26 194 q 5 -4 10 0 q 5 -4 10 0"/>
  </g>

  <!-- ===== 海 ===== -->
  <rect x="0" y="310" width="800" height="88" fill="url(#gSea)"/>
  <rect x="0" y="310" width="800" height="2.5" fill="#e9fbff" opacity=".65"/>
  <g id="waves" stroke="#ffffff" fill="none" stroke-linecap="round" opacity=".45"></g>

  <!-- ===== 木栈道 ===== -->
  <rect x="0" y="398" width="800" height="102" fill="url(#gWood)"/>
  <rect x="0" y="398" width="800" height="8" fill="#e6b98c"/>
  <rect x="0" y="406" width="800" height="3" fill="#a97040" opacity=".65"/>
  <g id="planks" stroke="#9c6634" stroke-width="3" stroke-linecap="round" opacity=".45"></g>
  <path d="M0 431 H800 M0 469 H800" stroke="#a97040" stroke-width="2" fill="none" opacity=".3"/>

  <ellipse cx="408" cy="401" rx="152" ry="9" fill="#6b4522" opacity=".2"/>

  <!-- 尾气 / 速度线 -->
  <g fill="#e8d2ae">
    <circle class="puff" style="animation-delay:0s"   cx="286" cy="384" r="9"/>
    <circle class="puff" style="animation-delay:.38s" cx="278" cy="390" r="7"/>
    <circle class="puff" style="animation-delay:.74s" cx="292" cy="378" r="6"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".75">
    <line class="streak" style="animation-delay:0s"   x1="540" y1="196" x2="596" y2="196"/>
    <line class="streak" style="animation-delay:.26s" x1="556" y1="228" x2="612" y2="228"/>
    <line class="streak" style="animation-delay:.52s" x1="548" y1="262" x2="604" y2="262"/>
  </g>

  <!-- ===== 自行车 ===== -->
  <g id="rig">
    <g id="wheelRear" transform="translate(295,344)">
      <circle r="50" fill="none" stroke="#2b2d42" stroke-width="8"/>
      <circle r="43" fill="none" stroke="#cfdae6" stroke-width="3"/>
      <g stroke="#b9c6d4" stroke-width="1.6">
        <line x1="0" y1="-43" x2="0" y2="43"/>
        <line x1="-43" y1="0" x2="43" y2="0"/>
        <line x1="-30.4" y1="-30.4" x2="30.4" y2="30.4"/>
        <line x1="-30.4" y1="30.4" x2="30.4" y2="-30.4"/>
      </g>
      <circle r="5" fill="#7b8794"/>
    </g>
    <g id="wheelFront" transform="translate(520,344)">
      <circle r="50" fill="none" stroke="#2b2d42" stroke-width="8"/>
      <circle r="43" fill="none" stroke="#cfdae6" stroke-width="3"/>
      <g stroke="#b9c6d4" stroke-width="1.6">
        <line x1="0" y1="-43" x2="0" y2="43"/>
        <line x1="-43" y1="0" x2="43" y2="0"/>
        <line x1="-30.4" y1="-30.4" x2="30.4" y2="30.4"/>
        <line x1="-30.4" y1="30.4" x2="30.4" y2="-30.4"/>
      </g>
      <circle r="5" fill="#7b8794"/>
    </g>

    <!-- 链条与牙盘 -->
    <circle cx="402" cy="352" r="17" fill="none" stroke="#6b7280" stroke-width="3"/>
    <line x1="402" y1="335" x2="295" y2="338" stroke="#7b8794" stroke-width="2.5"/>
    <line x1="402" y1="369" x2="295" y2="350" stroke="#7b8794" stroke-width="2.5"/>
    <circle cx="295" cy="344" r="6" fill="#7b8794"/>

    <!-- 车架 -->
    <g fill="none" stroke="#e63946" stroke-width="8" stroke-linecap="round">
      <path d="M402 352 L352 240"/>
      <path d="M352 240 L487 238"/>
      <path d="M402 352 L497 278"/>
      <path d="M487 238 L497 278"/>
      <path d="M497 278 L520 344"/>
      <path d="M402 352 L295 344"/>
      <path d="M352 240 L295 344"/>
      <path d="M487 238 L500 212"/>
    </g>
    <path d="M468 214 Q 500 199 534 214" fill="none" stroke="#2b2d42" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="346" cy="235" rx="26" ry="8" fill="#2b2d42" transform="rotate(-7 346 235)"/>
  </g>

  <!-- ===== 双腿：曲柄 + 两段式 IK ===== -->
  <g id="legFar" fill="none" stroke-linecap="round">
    <line id="legFarCrank" stroke="#3f4457" stroke-width="7"/>
    <line id="legFarThigh" stroke="#cf8642" stroke-width="13"/>
    <line id="legFarShin"  stroke="#cf8642" stroke-width="11"/>
    <circle id="legFarKnee" r="6.5" fill="#cf8642"/>
    <g id="legFarFoot">
      <rect x="-13" y="-4" width="26" height="7" rx="3.5" fill="#2b2d42"/>
      <ellipse cx="-2" cy="-8" rx="13" ry="7" fill="#cf8642"/>
    </g>
  </g>
  <g id="legNear" fill="none" stroke-linecap="round">
    <line id="legNearCrank" stroke="#4a4e69" stroke-width="7"/>
    <line id="legNearThigh" stroke="#f2a154" stroke-width="13.5"/>
    <line id="legNearShin"  stroke="#f2a154" stroke-width="11.5"/>
    <circle id="legNearKnee" r="7" fill="#f2a154"/>
    <g id="legNearFoot">
      <rect x="-14" y="-4.5" width="28" height="8" rx="4" fill="#1f2333"/>
      <ellipse cx="-2" cy="-9" rx="14" ry="7.5" fill="#f2a154"/>
    </g>
  </g>

  <!-- ===== 鹈鹕 ===== -->
  <g id="pelican">
    <!-- 尾羽 -->
    <path d="M300 182 C 266 168 232 174 212 196 C 244 196 276 204 300 212 Z" fill="url(#gPlumage)"/>
    <path d="M246 192 L296 197 M242 197 L292 205" stroke="#c9d8e6" stroke-width="2" fill="none"/>

    <!-- 身体 -->
    <ellipse cx="338" cy="196" rx="58" ry="40" fill="url(#gPlumage)" transform="rotate(-7 338 196)"/>
    <ellipse cx="332" cy="214" rx="40" ry="18" fill="#cbdae8" opacity=".4" transform="rotate(-7 338 196)"/>

    <!-- 翅膀：向前抓住车把 -->
    <path d="M372 166 C 414 156 470 174 524 202 C 534 207 532 223 519 221 C 470 200 420 190 370 194 Z"
          fill="url(#gPlumage)" stroke="#c9d8e6" stroke-width="1.5"/>
    <path d="M404 176 C 444 174 484 187 514 203" fill="none" stroke="#c9d8e6" stroke-width="1.6"/>
    <path d="M420 196 C 452 196 486 206 512 218" fill="none" stroke="#c9d8e6" stroke-width="1.4"/>

    <!-- 脖子 / 头 / 喙 -->
    <g id="headGrp">
      <path d="M366 194 C 378 158 394 128 420 112 L 448 128 C 424 148 404 178 396 208 Z" fill="url(#gPlumage)"/>
      <path d="M428 92 C 418 84 406 82 396 86 C 408 90 418 96 422 106 Z" fill="url(#gPlumage)"/>
      <circle cx="444" cy="104" r="23" fill="url(#gPlumage)"/>
      <path d="M452 112 C 464 140 492 156 524 152 C 550 148 562 134 568 116 Z"
            fill="url(#gPouch)" stroke="#e79a35" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M452 94 C 496 88 536 94 564 102 C 572 105 574 112 568 116
               C 534 110 494 110 452 114 Z"
            fill="url(#gBeak)" stroke="#d9821a" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M452 112 C 494 108 534 109 566 114" fill="none" stroke="#c9761a" stroke-width="1.6" opacity=".75"/>
      <circle cx="450" cy="91" r="4.8" fill="#22303c"/>
      <circle cx="452" cy="89.2" r="1.7" fill="#ffffff"/>
    </g>

    <!-- 围巾：绕颈一圈 + 迎风飘带 -->
    <path id="scarfTail" fill="#ef476f"/>
    <path d="M390 143 L417 164" stroke="#c9314f" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M390 143 L417 164" stroke="#ef476f" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>
</svg>
<p class="cap">🐦 鹈鹕骑自行车 · 纯 SVG + 原生 JavaScript 驱动</p>
<p class="byline">
  <span>作者 <b>deepseek-v4.1-flash</b></span>
  <span>提示词 <i>“帮我生成一个HTML，以SVG绘制一个鹈鹕骑着自行车的2D动画”</i></span>
</p>
</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  function mk(name, attrs) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* ---------- 场景几何（与上方 SVG 保持一致） ---------- */
  var REAR  = { x: 295, y: 344 };
  var FRONT = { x: 520, y: 344 };
  var BB    = { x: 402, y: 352 };   // 五通 / 曲柄中心
  var WR    = 50;                   // 车轮半径
  var CRANK = 22;                   // 曲柄长度
  var HIP   = { x: 372, y: 236 };   // 髋关节（藏在羽毛下）
  var L1 = 75, L2 = 73;             // 大腿 / 小腿
  var GEAR = 2.75;                  // 车轮转 1 圈 → 曲柄转 GEAR 圈
  var SPEED = 150;                  // 前进速度 px/s

  /* ---------- 程序化生成海面波纹与栈道木板 ---------- */
  var plankG = $('planks'), PS = 68;
  for (var x = -PS; x <= 800 + 2 * PS; x += PS) {
    plankG.appendChild(mk('line', { x1: x, y1: 407, x2: x, y2: 500 }));
    plankG.appendChild(mk('line', { x1: x + 14, y1: 437, x2: x + 46, y2: 437, 'stroke-width': 2, opacity: .5 }));
    plankG.appendChild(mk('line', { x1: x + 22, y1: 473, x2: x + 58, y2: 473, 'stroke-width': 2, opacity: .4 }));
  }
  var waveG = $('waves'), WS = 96;
  [330, 354, 378].forEach(function (y) {
    for (var wx = -WS; wx <= 800 + 2 * WS; wx += WS) {
      waveG.appendChild(mk('path', { d: 'M' + wx + ' ' + y + ' q 24 -9 48 0 t 48 0', 'stroke-width': 2.5 }));
    }
  });

  /* ---------- 两段式反向 IK：解出鸟类的“后弯膝” ---------- */
  function knee(H, P) {
    var dx = P.x - H.x, dy = P.y - H.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    var max = (L1 + L2) * 0.999;
    if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    var ux = dx / d, uy = dy / d;
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    return { x: H.x + a * ux + h * uy, y: H.y + a * uy - h * ux };
  }
  function seg(id, a, b) {
    var e = $(id);
    e.setAttribute('x1', a.x); e.setAttribute('y1', a.y);
    e.setAttribute('x2', b.x); e.setAttribute('y2', b.y);
  }

  function driveLeg(tag, P, hip) {
    var K = knee(hip, P);
    seg('leg' + tag + 'Thigh', hip, K);
    seg('leg' + tag + 'Shin',  K, P);
    seg('leg' + tag + 'Crank', BB, P);
    var kn = $('leg' + tag + 'Knee');
    kn.setAttribute('cx', K.x); kn.setAttribute('cy', K.y);
    $('leg' + tag + 'Foot').setAttribute('transform', 'translate(' + P.x + ',' + P.y + ')');
  }

  /* ---------- 主循环 ---------- */
  var dist = 0, last = 0;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function render(dt) {
    dist += SPEED * dt;

    var wheelDeg = dist / WR * 180 / Math.PI;
    $('wheelRear').setAttribute('transform',  'translate(' + REAR.x  + ',' + REAR.y  + ') rotate(' + wheelDeg.toFixed(2) + ')');
    $('wheelFront').setAttribute('transform', 'translate(' + FRONT.x + ',' + FRONT.y + ') rotate(' + wheelDeg.toFixed(2) + ')');

    var crank = dist / WR * GEAR;                 // 弧度
    var bob   = Math.sin(crank * 2) * 2;          // 每踏一圈身体起伏两次
    var hip   = { x: HIP.x, y: HIP.y + bob };

    var pNear = { x: BB.x + CRANK * Math.cos(crank),           y: BB.y + CRANK * Math.sin(crank) };
    var pFar  = { x: BB.x + CRANK * Math.cos(crank + Math.PI), y: BB.y + CRANK * Math.sin(crank + Math.PI) };
    driveLeg('Near', pNear, hip);
    driveLeg('Far',  pFar,  hip);

    $('pelican').setAttribute('transform', 'translate(0,' + bob.toFixed(2) + ')');
    $('headGrp').setAttribute('transform',
      'rotate(' + (Math.sin(crank * 2 + 0.9) * 2.2).toFixed(2) + ' 390 192)');

    var w  = Math.sin(dist * 0.05) * 9 + Math.sin(dist * 0.031 + 1.3) * 5;
    var w2 = w * 0.55;
    $('scarfTail').setAttribute('d',
      'M402 146 C 372 138 342 ' + (158 + w2).toFixed(1) + ' 306 ' + (148 + w).toFixed(1) +
      ' L 312 ' + (162 + w * 0.9).toFixed(1) +
      ' C 344 ' + (176 + w2).toFixed(1) + ' 376 170 404 161 Z');

    // 栈道与车轮同速滚动（1:1），海面做远景视差
    plankG.setAttribute('transform', 'translate(' + (-(dist % PS)).toFixed(1) + ',0)');
    waveG.setAttribute('transform',  'translate(' + (-(dist * 0.28 % WS)).toFixed(1) + ',0)');
  }

  function loop(ts) {
    if (!last) last = ts;
    var dt = Math.min(60, ts - last) / 1000;
    last = ts;
    render(dt);
    requestAnimationFrame(loop);
  }

  render(0);
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
