<script>
  (() => {
    'use strict';
    const byId = id => document.getElementById(id);
    const ui = { toggle: byId('toggle'), speed: byId('speed'), speedLabel: byId('speedLabel') };
    const nodes = {
      front: byId('frontSpin'), rear: byId('rearSpin'), crank: byId('crank'),
      bird: byId('birdBob'), wing: byId('wing'),
      nearLeg: byId('nearLegPath'), farLeg: byId('farLegPath'),
      nearKnee: byId('nearKnee'), farKnee: byId('farKnee'),
      nearPedal: byId('nearPedal'), farPedal: byId('farPedal'),
      road: byId('roadScroll'), grass: byId('grassScroll'), clouds: byId('cloudDrift')
    };
    const center = { x: 548, y: 455 }, radius = 40;
    let elapsed = 0;
    let previousTime = null;
    let speed = 1;
    let running = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // 逆运动学：由髋部与脚踏位置求膝盖，避免僵硬的摆动。
    function findKnee(hip, foot, upper = 88, lower = 102) {
      const dx = foot.x - hip.x, dy = foot.y - hip.y;
      const distance = Math.max(0.001, Math.hypot(dx, dy));
      const effective = Math.min(distance, upper + lower - 0.001);
      const along = (upper * upper - lower * lower + effective * effective) / (2 * effective);
      const offset = Math.sqrt(Math.max(0, upper * upper - along * along));
      const nx = dx / distance, ny = dy / distance;
      return { x: hip.x + along * nx + offset * ny,
               y: hip.y + along * ny - offset * nx };
    }
    function setLeg(path, kneeNode, pedalNode, hip, foot, lengths) {
      const knee = findKnee(hip, foot, lengths[0], lengths[1]);
      path.setAttribute('d', `M${hip.x.toFixed(2)} ${hip.y.toFixed(2)} L${knee.x.toFixed(2)} ${knee.y.toFixed(2)} L${foot.x.toFixed(2)} ${foot.y.toFixed(2)}`);
      kneeNode.setAttribute('cx', knee.x.toFixed(2));
      kneeNode.setAttribute('cy', knee.y.toFixed(2));
      pedalNode.setAttribute('transform', `translate(${foot.x.toFixed(2)} ${foot.y.toFixed(2)})`);
    }
    function render(t) {
      const theta = t * (Math.PI * 2 / 1.36) - Math.PI / 2;
      const degrees = theta * 180 / Math.PI;
      const bob = 2.8 * Math.sin(2 * theta);
      const nearFoot = { x: center.x + radius * Math.cos(theta), y: center.y + radius * Math.sin(theta) };
      const farFoot = { x: center.x - radius * Math.cos(theta), y: center.y - radius * Math.sin(theta) };
      nodes.front.setAttribute('transform', `translate(796 455) rotate(${degrees.toFixed(2)})`);
      nodes.rear.setAttribute('transform', `translate(365 455) rotate(${degrees.toFixed(2)})`);
      // 初始脚踏在正上方，两根曲柄始终相差 180 度。
      nodes.crank.setAttribute('transform', `rotate(${(degrees + 90).toFixed(2)} 548 455)`);
      nodes.bird.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
      nodes.wing.setAttribute('transform', `rotate(${(3.6 * Math.sin(theta + .35)).toFixed(2)} 535 283)`);
      setLeg(nodes.farLeg, nodes.farKnee, nodes.farPedal,
        { x: 508, y: 338 + bob }, farFoot, [89, 103]);
      setLeg(nodes.nearLeg, nodes.nearKnee, nodes.nearPedal,
        { x: 533, y: 337 + bob }, nearFoot, [88, 102]);
      nodes.road.setAttribute('transform', `translate(${(-(t * 145) % 1320).toFixed(2)} 0)`);
      nodes.grass.setAttribute('transform', `translate(${(-(t * 110) % 1200).toFixed(2)} 0)`);
      nodes.clouds.setAttribute('transform', `translate(${(-(t * 16) % 1300).toFixed(2)} 0)`);
    }
    function tick(time) {
      if (previousTime !== null && running) elapsed += Math.min((time - previousTime) / 1000, .06) * speed;
      previousTime = time;
      render(elapsed);
      requestAnimationFrame(tick);
    }
    function updateToggle() {
      ui.toggle.textContent = running ? '暂停动画' : '继续动画';
      ui.toggle.setAttribute('aria-pressed', String(!running));
    }
    ui.toggle.addEventListener('click', () => { running = !running; updateToggle(); });
    ui.speed.addEventListener('input', () => {
      speed = Number(ui.speed.value);
      ui.speedLabel.value = `${speed.toFixed(1)}×`;
    });
    document.addEventListener('visibilitychange', () => { previousTime = null; });
    updateToggle();
    render(0);
    requestAnimationFrame(tick);
  })();
</script>
