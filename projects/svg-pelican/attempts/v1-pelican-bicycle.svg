<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <clipPath id="viewportClip">
      <rect x="0" y="0" width="800" height="600"/>
    </clipPath>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2C3E70"/><stop offset="35%" stop-color="#5B7DB5"/><stop offset="65%" stop-color="#E8A87C"/><stop offset="100%" stop-color="#FDE8C8"/>
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A6274"/><stop offset="100%" stop-color="#6B8A9E"/></linearGradient>
    <linearGradient id="mountainGrad2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3D5568"/><stop offset="100%" stop-color="#5A7D91"/></linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6B8E4E"/><stop offset="40%" stop-color="#4E6B3A"/><stop offset="100%" stop-color="#2E4018"/></linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D4443B"/><stop offset="50%" stop-color="#B8332A"/><stop offset="100%" stop-color="#8A1F18"/></linearGradient>
    <radialGradient id="pelicanBody" cx="0.4" cy="0.35" r="0.7"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#F5F5F0"/><stop offset="100%" stop-color="#D8D8D0"/></radialGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0F0F0"/><stop offset="50%" stop-color="#DCDCDC"/><stop offset="100%" stop-color="#B8B8B8"/></linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F5A623"/><stop offset="60%" stop-color="#E8951A"/><stop offset="100%" stop-color="#C47A10"/></linearGradient>
    <radialGradient id="pouchGrad" cx="0.5" cy="0.3" r="0.8"><stop offset="0%" stop-color="#F0A030"/><stop offset="70%" stop-color="#D08020"/><stop offset="100%" stop-color="#A06018"/></radialGradient>
    <pattern id="grassPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="none"/><line x1="3" y1="18" x2="5" y2="10" stroke="#5A8A3A" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="18" x2="14" y2="8" stroke="#6B9E4E" stroke-width="1.2" stroke-linecap="round"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter>
    <filter id="distanceBlur"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- 将所有可见内容包裹在裁剪组中 -->
  <g clip-path="url(#viewportClip)">
    <!-- 天空 -->
    <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>
    <circle cx="620" cy="85" r="45" fill="#F5D0A9" opacity="0.6" filter="url(#glow)"/>
    <circle cx="620" cy="85" r="18" fill="#FDE8C8" opacity="0.9"/>

    <!-- 云朵 -->
    <g opacity="0.7"><g><animateTransform attributeName="transform" type="translate" values="0 0; -80 0; 0 0" dur="12s" repeatCount="indefinite"/><g fill="white" opacity="0.6"><ellipse cx="200" cy="80" rx="50" ry="22"/><ellipse cx="240" cy="70" rx="40" ry="18"/><ellipse cx="170" cy="75" rx="30" ry="15"/></g></g></g>

    <!-- 远山（单向循环） -->
    <g filter="url(#distanceBlur)"><g><animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="8s" repeatCount="indefinite"/><g><path d="M 0 420 L 80 300 L 180 420 Z" fill="url(#mountainGrad1)" opacity="0.7"/><path d="M 120 420 L 220 260 L 320 420 Z" fill="url(#mountainGrad2)" opacity="0.6"/><path d="M 260 420 L 360 280 L 460 420 Z" fill="url(#mountainGrad1)" opacity="0.5"/><path d="M 400 420 L 500 240 L 600 420 Z" fill="url(#mountainGrad2)" opacity="0.6"/><path d="M 550 420 L 650 290 L 750 420 Z" fill="url(#mountainGrad1)" opacity="0.5"/><path d="M 220 260 L 200 290 L 240 290 Z" fill="white" opacity="0.5"/><path d="M 500 240 L 480 270 L 520 270 Z" fill="white" opacity="0.4"/></g><g transform="translate(800,0)"><path d="M 0 420 L 80 300 L 180 420 Z" fill="url(#mountainGrad1)" opacity="0.7"/><path d="M 120 420 L 220 260 L 320 420 Z" fill="url(#mountainGrad2)" opacity="0.6"/><path d="M 260 420 L 360 280 L 460 420 Z" fill="url(#mountainGrad1)" opacity="0.5"/><path d="M 400 420 L 500 240 L 600 420 Z" fill="url(#mountainGrad2)" opacity="0.6"/><path d="M 550 420 L 650 290 L 750 420 Z" fill="url(#mountainGrad1)" opacity="0.5"/><path d="M 220 260 L 200 290 L 240 290 Z" fill="white" opacity="0.5"/><path d="M 500 240 L 480 270 L 520 270 Z" fill="white" opacity="0.4"/></g></g></g>

    <!-- 中景树木（单向循环） -->
    <g><g><animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="4s" repeatCount="indefinite"/><g><g transform="translate(80,450)"><rect x="-6" y="-40" width="12" height="40" fill="#5A3E2A" rx="2"/><ellipse cx="0" cy="-55" rx="30" ry="35" fill="#4A6B3A"/><ellipse cx="-15" cy="-45" rx="18" ry="22" fill="#3D5A30"/><ellipse cx="15" cy="-50" rx="16" ry="20" fill="#5A8A3A"/></g><g transform="translate(280,450)"><rect x="-8" y="-35" width="16" height="35" fill="#4A3020" rx="3"/><ellipse cx="0" cy="-50" rx="35" ry="40" fill="#3D5A30"/><ellipse cx="-18" cy="-40" rx="20" ry="25" fill="#355028"/><ellipse cx="18" cy="-45" rx="18" ry="22" fill="#4A6B3A"/></g><ellipse cx="150" cy="450" rx="25" ry="15" fill="#5A8A3A" opacity="0.7"/><ellipse cx="450" cy="450" rx="20" ry="12" fill="#4A6B3A" opacity="0.6"/></g><g transform="translate(800,0)"><g transform="translate(80,450)"><rect x="-6" y="-40" width="12" height="40" fill="#5A3E2A" rx="2"/><ellipse cx="0" cy="-55" rx="30" ry="35" fill="#4A6B3A"/><ellipse cx="-15" cy="-45" rx="18" ry="22" fill="#3D5A30"/><ellipse cx="15" cy="-50" rx="16" ry="20" fill="#5A8A3A"/></g><ellipse cx="620" cy="450" rx="28" ry="14" fill="#6B9E4E" opacity="0.7"/></g></g></g>

    <!-- 地面 -->
    <rect x="0" y="450" width="800" height="150" fill="url(#groundGrad)"/>
    <rect x="0" y="450" width="800" height="150" fill="url(#grassPattern)" opacity="0.5"/>

    <!-- 前景草（单向循环+摆动） -->
    <g><g><animateTransform attributeName="transform" type="translate" values="0 0; -800 0" dur="2s" repeatCount="indefinite"/><g stroke-linecap="round" fill="none"><path d="M 100 480 Q 105 450 95 435" stroke="#5A8A3A" stroke-width="2.5"><animateTransform attributeName="transform" type="rotate" values="-2 100 480;3 100 480;-2 100 480" dur="1s" repeatCount="indefinite"/></path><path d="M 350 475 Q 355 445 345 425" stroke="#6B9E4E" stroke-width="2.5"><animateTransform attributeName="transform" type="rotate" values="0 350 475;-2 350 475;0 350 475" dur="1.3s" repeatCount="indefinite"/></path><path d="M 600 478 Q 608 450 600 430" stroke="#5A8A3A" stroke-width="2.8"><animateTransform attributeName="transform" type="rotate" values="2 600 478;-2 600 478;2 600 478" dur="1.1s" repeatCount="indefinite"/></path><path d="M 750 480 Q 758 452 750 438" stroke="#6B9E4E" stroke-width="2.5"><animateTransform attributeName="transform" type="rotate" values="1 750 480;-2 750 480;1 750 480" dur="1.4s" repeatCount="indefinite"/></path></g><g><circle cx="112" cy="438" r="4" fill="#F5A0A0"/><circle cx="112" cy="438" r="2" fill="#F5D0D0"/><circle cx="618" cy="432" r="4" fill="#F5D0A0"/><circle cx="618" cy="432" r="2" fill="#F5E8D0"/></g><g transform="translate(800,0)"><g stroke-linecap="round" fill="none"><path d="M 100 480 Q 105 450 95 435" stroke="#5A8A3A" stroke-width="2.5"><animateTransform attributeName="transform" type="rotate" values="-2 100 480;3 100 480;-2 100 480" dur="1s" repeatCount="indefinite"/></path><path d="M 600 478 Q 608 450 600 430" stroke="#5A8A3A" stroke-width="2.8"><animateTransform attributeName="transform" type="rotate" values="2 600 478;-2 600 478;2 600 478" dur="1.1s" repeatCount="indefinite"/></path></g></g></g></g>

    <!-- 地面阴影 -->
    <ellipse cx="300" cy="482" rx="58" ry="7" fill="#1A2A10" opacity="0.4"/>
    <ellipse cx="500" cy="482" rx="58" ry="7" fill="#1A2A10" opacity="0.4"/>
    <ellipse cx="375" cy="478" rx="65" ry="10" fill="#1A2A10" opacity="0.35"><animate attributeName="rx" values="65;62;65;68;65" dur="2s" repeatCount="indefinite"/></ellipse>

    <!-- ==================== 图层1：远侧腿（在自行车后方） ==================== -->
    <g id="far-leg" fill="none" stroke="#C47A10" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path>
        <animate attributeName="d"
          values="M 385 315 L 400 420 L 350 440;
                  M 385 315 L 395 370 L 390 400;
                  M 385 315 L 410 380 L 430 440;
                  M 385 315 L 395 370 L 390 480;
                  M 385 315 L 400 420 L 350 440"
          dur="2s" repeatCount="indefinite"
          keyTimes="0;0.25;0.5;0.75;1"
          calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
      </path>
    </g>

    <!-- ==================== 图层2：远侧曲柄+踏板+脚 ==================== -->
    <g id="far-crank">
      <animateTransform attributeName="transform" type="rotate" from="0 390 440" to="360 390 440" dur="2s" repeatCount="indefinite"/>
      <line x1="390" y1="440" x2="350" y2="440" stroke="#666" stroke-width="6" stroke-linecap="round"/>
      <rect x="342" y="434" width="22" height="11" rx="3" fill="#333"/>
      <rect x="344" y="435" width="18" height="9" rx="2" fill="#444"/>
      <path d="M 343 434 L 347 428 L 352 434 L 356 438 L 351 437 L 348 441 L 344 437 L 340 438 Z" fill="#C47A10" stroke="#B87820" stroke-width="0.8"/>
    </g>

    <!-- ==================== 图层3：自行车车架 ==================== -->
    <g id="bicycle-frame">
      <!-- 后轮 -->
      <g><animateTransform attributeName="transform" type="rotate" from="0 300 420" to="360 300 420" dur="2s" repeatCount="indefinite"/>
        <circle cx="300" cy="420" r="60" fill="none" stroke="#1A1A1A" stroke-width="9"/>
        <circle cx="300" cy="420" r="55" fill="none" stroke="#2A2A2A" stroke-width="3"/>
        <circle cx="300" cy="420" r="50" fill="none" stroke="#555" stroke-width="1.5"/>
        <g stroke="#888" stroke-width="1.2" stroke-linecap="round">
          <line x1="300" y1="370" x2="300" y2="470"/><line x1="250" y1="420" x2="350" y2="420"/>
          <line x1="264" y1="384" x2="336" y2="456"/><line x1="264" y1="456" x2="336" y2="384"/>
          <line x1="277" y1="372" x2="323" y2="468"/><line x1="323" y1="372" x2="277" y2="468"/>
          <line x1="285" y1="362" x2="315" y2="478"/><line x1="315" y1="362" x2="285" y2="478"/>
        </g>
        <circle cx="300" cy="420" r="12" fill="#666"/><circle cx="300" cy="420" r="8" fill="#888"/><circle cx="300" cy="420" r="4" fill="#AAA"/>
      </g>
      <!-- 前轮 -->
      <g><animateTransform attributeName="transform" type="rotate" from="0 500 420" to="360 500 420" dur="2s" repeatCount="indefinite"/>
        <circle cx="500" cy="420" r="60" fill="none" stroke="#1A1A1A" stroke-width="9"/>
        <circle cx="500" cy="420" r="55" fill="none" stroke="#2A2A2A" stroke-width="3"/>
        <circle cx="500" cy="420" r="50" fill="none" stroke="#555" stroke-width="1.5"/>
        <g stroke="#888" stroke-width="1.2" stroke-linecap="round">
          <line x1="500" y1="370" x2="500" y2="470"/><line x1="450" y1="420" x2="550" y2="420"/>
          <line x1="464" y1="384" x2="536" y2="456"/><line x1="464" y1="456" x2="536" y2="384"/>
          <line x1="477" y1="372" x2="523" y2="468"/><line x1="523" y1="372" x2="477" y2="468"/>
          <line x1="485" y1="362" x2="515" y2="478"/><line x1="515" y1="362" x2="485" y2="478"/>
        </g>
        <circle cx="500" cy="420" r="12" fill="#666"/><circle cx="500" cy="420" r="8" fill="#888"/><circle cx="500" cy="420" r="4" fill="#AAA"/>
      </g>
      <!-- 车架 -->
      <g stroke="url(#frameGrad)" stroke-linecap="round">
        <line x1="300" y1="420" x2="390" y2="440" stroke-width="7"/>
        <line x1="300" y1="420" x2="370" y2="338" stroke-width="6"/>
        <line x1="390" y1="440" x2="370" y2="338" stroke-width="6.5"/>
        <line x1="390" y1="440" x2="468" y2="355" stroke-width="7"/>
        <line x1="370" y1="338" x2="468" y2="355" stroke-width="6"/>
        <line x1="468" y1="355" x2="482" y2="328" stroke-width="7"/>
        <line x1="482" y1="328" x2="500" y2="420" stroke-width="6"/>
      </g>
      <!-- 座垫/车把/链条 -->
      <path d="M 348 338 Q 370 320 392 338 Q 382 345 370 345 Z" fill="#2A2A2A"/>
      <path d="M 470 355 Q 485 340 492 332 L 500 328" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>
      <circle cx="492" cy="332" r="4" fill="#333"/><circle cx="500" cy="328" r="3" fill="#333"/>
      <path d="M 300 420 L 390 440" stroke="#555" stroke-width="4" stroke-dasharray="3 3"><animate attributeName="stroke-dashoffset" from="0" to="-12" dur="0.5s" repeatCount="indefinite"/></path>
      <circle cx="300" cy="420" r="16" fill="none" stroke="#666" stroke-width="3"/><circle cx="300" cy="420" r="12" fill="#555"/><circle cx="300" cy="420" r="5" fill="#777"/>
      <circle cx="390" cy="440" r="22" fill="none" stroke="#666" stroke-width="3"/><circle cx="390" cy="440" r="17" fill="#555"/><circle cx="390" cy="440" r="8" fill="#777"/>
    </g>

    <!-- ==================== 图层4：近侧曲柄+踏板+脚 ==================== -->
    <g id="near-crank">
      <animateTransform attributeName="transform" type="rotate" from="0 390 440" to="360 390 440" dur="2s" repeatCount="indefinite"/>
      <line x1="390" y1="440" x2="430" y2="440" stroke="#444" stroke-width="7" stroke-linecap="round"/>
      <rect x="422" y="434" width="22" height="11" rx="3" fill="#2A2A2A"/>
      <rect x="424" y="435" width="18" height="9" rx="2" fill="#3A3A3A"/>
      <path d="M 425 434 L 429 428 L 434 434 L 438 438 L 433 437 L 430 441 L 426 437 L 422 438 Z" fill="#F5A623" stroke="#D08020" stroke-width="0.8"/>
    </g>

    <!-- ==================== 图层5：近侧腿 ==================== -->
    <g id="near-leg" fill="none" stroke="#F5A623" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
      <path>
        <animate attributeName="d"
          values="M 355 315 L 410 380 L 430 440;
                  M 355 315 L 395 410 L 390 480;
                  M 355 315 L 365 380 L 350 440;
                  M 355 315 L 395 370 L 390 400;
                  M 355 315 L 410 380 L 430 440"
          dur="2s" repeatCount="indefinite"
          keyTimes="0;0.25;0.5;0.75;1"
          calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
      </path>
    </g>

    <!-- ==================== 鹈鹕身体 ==================== -->
    <g id="pelican-body">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 -2; 0 4; 0 0" dur="2s" repeatCount="indefinite"/>
        <path d="M 320 280 Q 295 265 280 278 Q 298 292 320 295 Z" fill="#E8E8E5"/>
        <path d="M 318 275 Q 290 258 275 272 Q 295 288 318 290 Z" fill="#DCDCD8"/>
        <ellipse cx="370" cy="278" rx="52" ry="44" fill="url(#pelicanBody)"/>
        <ellipse cx="360" cy="292" rx="32" ry="24" fill="#F8F8F5" opacity="0.6"/>
        <g><animateTransform attributeName="transform" type="rotate" values="-15 338 258; 22 338 258; -15 338 258" dur="2s" repeatCount="indefinite"/><path d="M 340 258 Q 305 230 268 260 Q 295 298 340 288 Z" fill="url(#wingGrad)"/><path d="M 338 255 Q 298 225 255 258 Q 285 295 338 290 Z" fill="#C8C8C4" opacity="0.7"/></g>
        <path d="M 392 258 Q 420 228 428 208 Q 435 195 433 188" fill="none" stroke="url(#pelicanBody)" stroke-width="20" stroke-linecap="round"/>
        <circle cx="433" cy="183" r="21" fill="url(#pelicanBody)"/>
        <circle cx="440" cy="177" r="5" fill="white"/><circle cx="441" cy="177" r="3" fill="#1A1A1A"/><circle cx="442" cy="176" r="1.2" fill="white"/>
        <path d="M 444 172 Q 470 160 485 178 Q 478 180 455 185 Q 448 182 444 180 Z" fill="url(#beakGrad)" stroke="#C47A10" stroke-width="1.2"/>
        <path d="M 483 176 Q 490 182 484 186 Q 478 182 480 178 Z" fill="#D08020"/>
        <path d="M 444 180 Q 462 188 476 198 Q 468 204 450 198 Q 444 194 442 186 Z" fill="#E8951A" stroke="#C47A10" stroke-width="1"/>
        <path d="M 444 190 Q 465 200 478 205 Q 470 218 455 222 Q 442 220 436 210 Q 432 200 438 192 Z" fill="url(#pouchGrad)" opacity="0.85"/>
        <path d="M 442 198 Q 455 205 470 208" fill="none" stroke="#B87820" stroke-width="1" opacity="0.6"/>
      </g>
    </g>
  </g>
</svg>