html,body{margin:0;height:100%;overflow:hidden;background:var(--sea)}
svg{display:block;width:100%;height:100%}
.spin,.sunspin{transform-origin:0 0}
.flap{transform-origin:86px -126px}
.bob{transform-origin:70px -132px}
.pouch{transform-origin:170px -170px}
.wiggle{transform-origin:176px -156px}
.blink{transform-origin:94px -200px}
.sway{transform-origin:center bottom}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes flap{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(16deg)}}

@keyframes pouch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.08)}}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}

@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes shimmer{0%,100%{opacity:.25}50%{opacity:.5}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes roll{to{transform:rotate(-360deg)}}
@keyframes dash{from{stroke-dashoffset:0}to{stroke-dashoffset:-40}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.7}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes kick{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
@keyframes foam{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.15)}}
@keyframes rise{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-6px)}}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
@keyframes stretch{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.04)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
@keyframes flick{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes sunspin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite}
.bounce{animation:bounce .7s ease-in-out infinite}
.flap{animation:flap .7s ease-in-out infinite}
.bob{animation:bob 1.4s ease-in-out infinite}
.pouch{animation:pouch 1.05s ease-in-out infinite}
.wiggle{animation:wiggle .9s ease-in-out infinite}
.drift{animation:drift 48s linear infinite}
.near{animation:drift 3.2s linear infinite}
.mid{animation:drift 16s linear infinite}
.far{animation:drift 28s linear infinite}
.wave{animation:wave 3.6s ease-in-out infinite}
.waveb{animation:wave 4.4s ease-in-out infinite reverse}
.sway{animation:sway 2.2s ease-in-out infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.shimmer{animation:shimmer 2.8s ease-in-out infinite}
.floaty{animation:floaty 3.4s ease-in-out infinite}
.dash{animation:dash 1.1s linear infinite}
.glow{animation:glow 3s ease-in-out infinite}
.nod{animation:nod 1.8s ease-in-out infinite}
.foam{animation:foam 5s ease-in-out infinite}
.blink{animation:blink 3.6s ease-in-out infinite}
.rise{animation:rise 6s ease-in-out infinite}
.tilt{animation:tilt 2.6s ease-in-out infinite}
.hop{animation:hop .7s ease-in-out infinite}
.sunspin{animation:sunspin 18s linear infinite}
</style>
