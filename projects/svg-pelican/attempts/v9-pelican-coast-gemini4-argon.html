.bell-ring-anim{animation:ringPulse .75s cubic-bezier(.16,1,.3,1) forwards;transform-origin:center;transform-box:fill-box}

        const lKnee=solveTwoBoneIK(currentHipX+4,currentHipY-2,lPedalX,lPedalY,thighLength,shinLength);
        dom.leftCrank.setAttribute('x2',lPedalX);dom.leftCrank.setAttribute('y2',lPedalY);
        dom.leftPedal.setAttribute('x',lPedalX-14);dom.leftPedal.setAttribute('y',lPedalY-4);
        dom.leftThigh.setAttribute('x1',currentHipX+4);dom.leftThigh.setAttribute('y1',currentHipY-2);
        dom.leftThigh.setAttribute('x2',lKnee.kneeX);dom.leftThigh.setAttribute('y2',lKnee.kneeY);
        dom.leftShin.setAttribute('x1',lKnee.kneeX);dom.leftShin.setAttribute('y1',lKnee.kneeY);
        dom.leftShin.setAttribute('x2',lPedalX);dom.leftShin.setAttribute('y2',lPedalY);
        dom.leftFoot.setAttribute('d',`M ${lPedalX-10},${lPedalY} L ${lPedalX+26},${lPedalY+3} L ${lPedalX+16},${lPedalY-9} Z`);
        const shoulderX=-38,shoulderY=-142+bodyBobY*.9;
        const elbowX=-2+bodyBobY*.4,elbowY=-108+bodyBobY*.6;
        dom.rightWingUpper.setAttribute('d',`M ${shoulderX},${shoulderY} Q ${elbowX},${elbowY} 44,-159`);
        dom.rightWingFeathers.setAttribute('d',`M ${shoulderX+6},${shoulderY+5} Q ${elbowX+4},${elbowY-4} 38,-153`);
        dom.leftWingPath.setAttribute('d',`M ${shoulderX+8},${shoulderY-12} Q ${elbowX+18},${elbowY-22} 54,-164`);
        cloudElements.forEach(cloud=>{
            let cx=parseFloat(cloud.dataset.x);
            const cy=parseFloat(cloud.dataset.y),sc=parseFloat(cloud.dataset.scale),cs=parseFloat(cloud.dataset.speed);
            cx-=(12+spd*35)*cs*dt;if(cx<-220)cx=1280;
            cloud.dataset.x=cx;cloud.setAttribute('transform',`translate(${cx},${cy}) scale(${sc})`);
        });
        lighthouseX-=spd*24*dt;if(lighthouseX<-160)lighthouseX=1320;
        dom.lighthouseGroup.setAttribute('transform',`translate(${lighthouseX},365)`);
        sailboatX-=spd*42*dt;if(sailboatX<-100)sailboatX=1280;
        const boatBob=Math.sin(state.wavePhase*1.3)*3,boatTilt=Math.cos(state.wavePhase*1.3)*2.5;
        dom.sailboatGroup.setAttribute('transform',`translate(${sailboatX},${392+boatBob}) rotate(${boatTilt})`);
        const waveShift1=now*.04*Math.max(.4,spd)%60;
        const waveShift2=now*.06*Math.max(.4,spd)%60;
        dom.wavePath1.setAttribute('transform',`translate(${-waveShift1},0)`);
        dom.wavePath2.setAttribute('transform',`translate(${-waveShift2},0)`);
        palmTrees.forEach((tree,idx)=>{
            tree.x-=spd*145*dt;if(tree.x<-140)tree.x=1320;
            $(`palmTree_${idx}`).setAttribute('transform',`translate(${tree.x},480) scale(${tree.scale})`);
        });
        fencePosts.forEach((post,idx)=>{
            post.x-=spd*220*dt;if(post.x<-40)post.x+=16*85;
            $(`fencePost_${idx}`).setAttribute('x',post.x);
        });
        roadStripes.forEach((stripe,idx)=>{
            stripe.x-=spd*390*dt;if(stripe.x<-120)stripe.x+=12*120;
            $(`roadStripe_${idx}`).setAttribute('transform',`translate(${stripe.x},0)`);
        });
        const targetMouthX=560+58,targetMouthY=455-245+bodyBobY;
        for(let i=activeFlyingFish.length-1;i>=0;i--){
            const f=activeFlyingFish[i];f.progress+=dt*1.55;const t=Math.min(1,f.progress);
            const ctrlX=(f.startX+targetMouthX)*.5,ctrlY=Math.min(f.startY,targetMouthY)-170;
            const curX=(1-t)*(1-t)*f.startX+2*(1-t)*t*ctrlX+t*t*targetMouthX;
            const curY=(1-t)*(1-t)*f.startY+2*(1-t)*t*ctrlY+t*t*targetMouthY;
            const tx=2*(1-t)*(ctrlX-f.startX)+2*t*(targetMouthX-ctrlX);
            const ty=2*(1-t)*(ctrlY-f.startY)+2*t*(targetMouthY-ctrlY);
            f.el.setAttribute('transform',`translate(${curX},${curY}) rotate(${Math.atan2(ty,tx)*180/Math.PI})`);
            if(t>=1){
                f.el.remove();activeFlyingFish.splice(i,1);state.fishCount++;
                state.pouchBounceVel+=180;state.beakOpenAmount=.25;
                playGulpSound();dom.fishCountReadout.textContent=state.fishCount;
            }
        }
        if(spd>1.55){
            const alpha=Math.min(.85,(spd-1.5)*.7),offset=now*.8%90;
            dom.windAndDustLayer.innerHTML=`
                <line x1="${-240-offset}" y1="-190" x2="${-150-offset}" y2="-190" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="${alpha}"/>
                <line x1="${-280-offset*.7}" y1="-95" x2="${-180-offset*.7}" y2="-95" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="${alpha}"/>
                <line x1="${-260-offset*1.1}" y1="35" x2="${-190-offset*1.1}" y2="35" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="${alpha}"/>`;
        } else if(dom.windAndDustLayer.innerHTML!=='')dom.windAndDustLayer.innerHTML='';
        dom.speedReadout.textContent=(spd*18.5).toFixed(1);
        dom.rpmReadout.textContent=Math.round(spd*72);
        requestAnimationFrame(animate);
    }
    function bindEventListeners(){
        $('speedSlider').addEventListener('input',e=>{
            const val=parseFloat(e.target.value);state.targetSpeed=val;
            let label,classes;
            if(val===0){
                label='驻车休息';classes='bg-slate-600/40 text-slate-300 border-slate-500/30';
            }else if(val<.8){
                label='慢速看海';classes='bg-emerald-500/20 text-emerald-300 border-emerald-400/30';
            }else if(val<=1.6){
                label='悠闲巡航';classes='bg-sky-500/20 text-sky-300 border-sky-400/30';
            }else{
                label='破风冲刺 🔥';classes='bg-rose-500/20 text-rose-300 border-rose-400/30';
            }
            dom.speedModeBadge.textContent=label;
            dom.speedModeBadge.className='px-2.5 py-0.5 rounded-full text-xs border '+classes;
        });
        $('feedFishBtn').addEventListener('click',()=>spawnFlyingFish(1120,160+Math.random()*140));
        $('sceneSvg').addEventListener('click',e=>{
            const sceneSvg=$('sceneSvg');
            const pt=sceneSvg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
            const matrix=sceneSvg.getScreenCTM();
            if(!matrix)return;
            const p=pt.matrixTransform(matrix.inverse());
            spawnFlyingFish(p.x,p.y);
        });
        $('ringBellBtn').addEventListener('click',triggerBikeBell);
        const xrayBtn=$('xrayToggleBtn');
        xrayBtn.addEventListener('click',()=>{
            state.xrayPouch=!state.xrayPouch;
            dom.pouchFishInside.setAttribute('opacity',state.xrayPouch?'.92':'.42');
            xrayBtn.setAttribute('aria-pressed',String(state.xrayPouch));
            xrayBtn.classList.toggle('bg-amber-500',state.xrayPouch);
            xrayBtn.classList.toggle('text-slate-950',state.xrayPouch);
            xrayBtn.classList.toggle('bg-slate-700',!state.xrayPouch);
            xrayBtn.classList.toggle('text-slate-200',!state.xrayPouch);
        });
        document.querySelectorAll('.theme-btn').forEach(btn=>
            btn.addEventListener('click',()=>applyTheme(btn.dataset.theme)));
        setTimeout(()=>{
            const banner=$('toastBanner');if(banner)banner.style.opacity='0';
        },5500);
    }
    initBackgroundElements();
    bindEventListeners();
    requestAnimationFrame(animate);
})();</script>
</body></html>
