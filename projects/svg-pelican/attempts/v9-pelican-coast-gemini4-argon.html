<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海滨漫游：鹈鹕骑自行车 SVG 2D 动画</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #38bdf8;
            --sky-mid: #bae6fd;
            --sky-bot: #fef08a;
            --sea-top: #0284c7;
            --sea-bot: #0369a1;
            --road-top: #64748b;
            --road-bot: #475569;
        }

        body {
            font-family: 'Noto Sans SC', 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* 昼夜与黄昏主题平滑过渡 */
        .theme-transition {
            transition: fill 0.9s cubic-bezier(0.4, 0, 0.2, 1),
                        stop-color 0.9s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.8s ease;
        }

        .ctrl-btn {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .ctrl-btn:hover {
            transform: translateY(-2px);
        }
        .ctrl-btn:active {
            transform: translateY(1px) scale(0.97);
        }

        /* 自定义滑块样式 */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(90deg, #38bdf8 0%, #f59e0b 60%, #ef4444 100%);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #0284c7;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            margin-top: -7px;
            transition: transform 0.15s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* 车铃音波动画 */
        @keyframes ringPulse {
            0% { transform: scale(0.4); opacity: 0.95; }
            100% { transform: scale(2.6); opacity: 0; }
        }
        .bell-ring-anim {
            animation: ringPulse 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: center;
            transform-box: fill-box;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 sm:p-6">

    <header class="w-full max-w-5xl flex flex-wrap items-center justify-between gap-3 mb-3 px-2">
        <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/20 text-2xl">
                🦩
            </div>
            <div>
                <h1 class="text-lg sm:text-2xl font-black tracking-tight bg-gradient-to-r from-sky-300 via-amber-200 to-orange-300 bg-clip-text text-transparent">
                    海风骑行：大嘴鹈鹕号
                </h1>
                <p class="text-xs sm:text-sm text-slate-400">
                    SVG 2D 逆向运动学（IK）骨骼联动 &amp; 多层视差动画
                </p>
            </div>
        </div>

        <!-- 实时骑行仪表盘 -->
        <div class="flex items-center gap-2 sm:gap-3 bg-slate-800/90 border border-slate-700/80 px-3.5 py-2 rounded-2xl backdrop-blur-md shadow-inner">
            <div class="text-center px-2 border-r border-slate-700">
                <div class="text-[11px] text-slate-400 uppercase tracking-wider">当前时速</div>
                <div class="text-sm sm:text-base font-extrabold text-sky-400"><span id="speedReadout">18.5</span> <span class="text-xs font-normal">km/h</span></div>
            </div>
            <div class="text-center px-2 border-r border-slate-700">
                <div class="text-[11px] text-slate-400 uppercase tracking-wider">踏频 CADENCE</div>
                <div class="text-sm sm:text-base font-extrabold text-emerald-400"><span id="rpmReadout">72</span> <span class="text-xs font-normal">RPM</span></div>
            </div>
            <div class="text-center px-2">
                <div class="text-[11px] text-slate-400 uppercase tracking-wider">喉囊存鱼</div>
                <div class="text-sm sm:text-base font-extrabold text-amber-400">🐟 <span id="fishCountReadout">2</span> <span class="text-xs font-normal">条</span></div>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl relative rounded-3xl overflow-hidden shadow-2xl border-2 border-slate-700/80 bg-slate-950 aspect-[16/10] sm:aspect-[16/9]">
        <!-- 顶部浮动快捷提示 -->
        <div id="toastBanner" class="pointer-events-none absolute top-3 left-1/2 -translate-x-1/2 z-20 bg-slate-900/80 backdrop-blur-md text-amber-200 border border-amber-400/30 px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium shadow-lg transition-opacity duration-500 opacity-90">
            💡 提示：点击画面可直接投喂小鱼，或使用下方控制台调节车速与昼夜！
        </div>

        <svg id="sceneSvg" viewBox="0 0 1200 675" class="w-full h-full block cursor-pointer" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 天空渐变 -->
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop id="skyStop1" class="theme-transition" offset="0%" stop-color="#0284c7" />
                    <stop id="skyStop2" class="theme-transition" offset="55%" stop-color="#7dd3fc" />
                    <stop id="skyStop3" class="theme-transition" offset="100%" stop-color="#fef9c3" />
                </linearGradient>

                <!-- 海洋渐变 -->
                <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop id="seaStop1" class="theme-transition" offset="0%" stop-color="#0369a1" />
                    <stop id="seaStop2" class="theme-transition" offset="100%" stop-color="#0c4a6e" />
                </linearGradient>

                <!-- 阳光/月光光晕 -->
                <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
                    <stop id="sunGlowStop1" offset="0%" stop-color="#fde047" stop-opacity="1" />
                    <stop id="sunGlowStop2" offset="45%" stop-color="#facc15" stop-opacity="0.45" />
                    <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
                </radialGradient>

                <!-- 鹈鹕大嘴与喉囊渐变 -->
                <linearGradient id="beakUpperGrad" x1="0%" y1="0%" x2="100%" y2="20%">
                    <stop offset="0%" stop-color="#f59e0b" />
                    <stop offset="65%" stop-color="#fbbf24" />
                    <stop offset="100%" stop-color="#ef4444" />
                </linearGradient>

                <linearGradient id="pouchGrad" x1="20%" y1="0%" x2="70%" y2="100%">
                    <stop offset="0%" stop-color="#fb923c" />
                    <stop offset="50%" stop-color="#f97316" />
                    <stop offset="100%" stop-color="#ea580c" />
                </linearGradient>

                <!-- 鹈鹕羽毛立体渐变 -->
                <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="75%" stop-color="#f1f5f9" />
                    <stop offset="100%" stop-color="#cbd5e1" />
                </linearGradient>

                <!-- 自行车复古薄荷绿车架渐变 -->
                <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#14b8a6" />
                    <stop offset="50%" stop-color="#0d9488" />
                    <stop offset="100%" stop-color="#0f766e" />
                </linearGradient>

                <!-- 车头大灯夜间光束渐变 -->
                <linearGradient id="headlightBeamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
                    <stop offset="0%" stop-color="#fef08a" stop-opacity="0.75" />
                    <stop offset="60%" stop-color="#fef08a" stop-opacity="0.2" />
                    <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
                </linearGradient>

                <!-- 公路渐变 -->
                <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#475569" />
                    <stop offset="15%" stop-color="#334155" />
                    <stop offset="100%" stop-color="#1e293b" />
                </linearGradient>

                <!-- 喉囊内部裁剪路径（用于X光透视小鱼） -->
                <clipPath id="pouchClip">
                    <path id="pouchClipPath" d="M 0,0 C 30,95 145,105 168,5 C 110,12 50,8 0,0 Z" />
                </clipPath>

                <!-- 柔和投影滤镜 -->
                <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
                    <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.28" />
                </filter>
            </defs>

            <!-- 1. 天空背景层 -->
            <rect width="1200" height="500" fill="url(#skyGrad)" />

            <!-- 星空层（夜间模式显现） -->
            <g id="starsGroup" class="theme-transition" opacity="0">
                <circle cx="120" cy="65" r="1.8" fill="#fff" />
                <circle cx="240" cy="110" r="2.4" fill="#fef08a" />
                <circle cx="390" cy="48" r="1.5" fill="#fff" />
                <circle cx="520" cy="95" r="2.2" fill="#fff" />
                <circle cx="680" cy="55" r="1.6" fill="#bae6fd" />
                <circle cx="790" cy="125" r="2.5" fill="#fef08a" />
                <circle cx="950" cy="60" r="1.8" fill="#fff" />
                <circle cx="1090" cy="105" r="2.2" fill="#fff" />
                <circle cx="165" cy="180" r="1.5" fill="#fff" />
                <circle cx="610" cy="160" r="1.9" fill="#fff" />
                <circle cx="1030" cy="175" r="1.6" fill="#fef08a" />
            </g>

            <!-- 太阳 / 月亮组 -->
            <g id="celestialGroup" transform="translate(920, 125)">
                <circle r="110" fill="url(#sunGlow)" />
                <circle id="sunDisk" r="46" fill="#fde047" class="theme-transition" />
                <!-- 月亮陨石坑（夜间显示） -->
                <g id="moonCraters" opacity="0" class="theme-transition" fill="#cbd5e1">
                    <circle cx="-14" cy="-10" r="8" opacity="0.5" />
                    <circle cx="16" cy="12" r="11" opacity="0.4" />
                    <circle cx="8" cy="-18" r="5" opacity="0.4" />
                </g>
            </g>

            <!-- 远景流云层 (视差层 1 - 极慢) -->
            <g id="cloudsLayer" fill="#ffffff" opacity="0.88">
                <g class="cloud-item" data-x="120" data-y="85" data-scale="0.9" data-speed="0.12">
                    <path d="M 0,30 Q 15,5 45,12 Q 68,-12 105,8 Q 135,2 150,28 Q 170,32 165,48 L -10,48 Q -18,35 0,30 Z" />
                </g>
                <g class="cloud-item" data-x="550" data-y="60" data-scale="1.15" data-speed="0.18">
                    <path d="M 0,30 Q 15,5 45,12 Q 68,-12 105,8 Q 135,2 150,28 Q 170,32 165,48 L -10,48 Q -18,35 0,30 Z" />
                </g>
                <g class="cloud-item" data-x="980" data-y="105" data-scale="0.75" data-speed="0.14">
                    <path d="M 0,30 Q 15,5 45,12 Q 68,-12 105,8 Q 135,2 150,28 Q 170,32 165,48 L -10,48 Q -18,35 0,30 Z" />
                </g>
            </g>

            <!-- 远景飞翔海鸥 -->
            <g id="seagullsLayer" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.65">
                <path id="gull1" d="M 280,155 Q 292,143 302,155 Q 312,143 324,155" />
                <path id="gull2" d="M 335,172 Q 344,163 352,172 Q 360,163 369,172" />
                <path id="gull3" d="M 760,130 Q 771,119 780,130 Q 789,119 800,130" />
            </g>

            <!-- 2. 远景海岛与灯塔 (视差层 2 - 慢速) -->
            <g id="distantIslandLayer">
                <!-- 远山/海岬 -->
                <path d="M -100,380 Q 80,295 270,380 T 680,380 T 1120,380 L 1300,380 L 1300,410 L -100,410 Z" fill="#64748b" opacity="0.35" />
                <!-- 灯塔岛屿（随进度循环移动） -->
                <g id="lighthouseGroup" transform="translate(820, 365)">
                    <!-- 礁石小岛 -->
                    <path d="M -90,20 Q -30,-15 45,20 Z" fill="#475569" />
                    <!-- 灯塔塔身 -->
                    <polygon points="-16,8 -10,-72 10,-72 16,8" fill="#f8fafc" />
                    <polygon points="-14,-12 -12,-32 12,-32 14,-12" fill="#ef4444" />
                    <polygon points="-11,-48 -10,-65 10,-65 11,-48" fill="#ef4444" />
                    <!-- 灯塔顶部灯室 -->
                    <rect x="-12" y="-82" width="24" height="10" rx="2" fill="#fef08a" stroke="#334155" stroke-width="2" />
                    <polygon points="-15,-82 0,-96 15,-82" fill="#dc2626" />
                    <!-- 灯塔夜间旋转光束 -->
                    <polygon id="lighthouseBeam" points="0,-77 -260,-145 -260,-15" fill="url(#headlightBeamGrad)" opacity="0" class="theme-transition" />
                </g>
            </g>

            <!-- 3. 海洋与白帆层 (视差层 3 - 中慢速) -->
            <rect x="0" y="378" width="1200" height="125" fill="url(#seaGrad)" />

            <!-- 海面帆船 -->
            <g id="sailboatGroup" transform="translate(320, 392)">
                <path d="M -28,0 L 28,0 L 18,12 L -18,12 Z" fill="#f8fafc" />
                <path d="M -22,3 L 22,3" stroke="#ef4444" stroke-width="3" />
                <path d="M 2,-2 L 2,-48 L 28,-6 Z" fill="#ffffff" />
                <path d="M -2,-4 L -2,-42 L -22,-8 Z" fill="#fef08a" />
            </g>

            <!-- 动态海浪线条 -->
            <g id="wavesLayer" stroke="#bae6fd" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55">
                <path id="wavePath1" d="M 0,405 Q 30,398 60,405 T 120,405 T 180,405 T 240,405 T 300,405 T 360,405 T 420,405 T 480,405 T 540,405 T 600,405 T 660,405 T 720,405 T 780,405 T 840,405 T 900,405 T 960,405 T 1020,405 T 1080,405 T 1140,405 T 1200,405 T 1260,405" />
                <path id="wavePath2" d="M -40,435 Q -10,428 20,435 T 80,435 T 140,435 T 200,435 T 260,435 T 320,435 T 380,435 T 440,435 T 500,435 T 560,435 T 620,435 T 680,435 T 740,435 T 800,435 T 860,435 T 920,435 T 980,435 T 1040,435 T 1100,435 T 1160,435 T 1220,435" opacity="0.7" />
            </g>

            <!-- 4. 海滨棕榈树与沙滩护栏层 (视差层 4 - 中速) -->
            <!-- 金色沙滩条带 -->
            <path d="M 0,468 Q 300,458 600,468 T 1200,466 L 1200,505 L 0,505 Z" fill="#fde68a" />

            <!-- 棕榈树与海滨灌木容器 (由JS动态更新位置) -->
            <g id="sceneryTreesLayer"></g>

            <!-- 海滨白色木护栏容器 -->
            <g id="boardwalkFenceLayer"></g>

            <!-- 5. 骑行公路层 (视差层 5 - 高速前景地面) -->
            <g id="roadLayer">
                <!-- 路肩石 -->
                <rect x="0" y="495" width="1200" height="14" fill="#cbd5e1" />
                <!-- 柏油路面 -->
                <rect x="0" y="509" width="1200" height="166" fill="url(#roadGrad)" />
                <!-- 路肩红白警示条与路面虚线容器 -->
                <g id="roadMarkingsLayer"></g>
            </g>

            <!-- 投喂小鱼的抛物线动画层 -->
            <g id="flyingFishLayer"></g>

            <!-- 6. 主角层：鹈鹕与自行车总成 -->
            <g id="pelicanBikeRig" transform="translate(560, 455)" filter="url(#softShadow)">

                <!-- 地面动态车影 -->
                <ellipse id="groundShadow" cx="10" cy="112" rx="185" ry="14" fill="#0f172a" opacity="0.42" />

                <!-- 尾气/冲刺风线与小灰尘层 -->
                <g id="windAndDustLayer"></g>

                <!-- 整体车身与身体律动倾角容器 -->
                <g id="bikeChassisGroup">

                    <!-- ======== A. 远端肢体层（在车架后方：左腿、左翼） ======== -->
                    <!-- 左翼（远端手臂，握把） -->
                    <g id="leftWingGroup">
                        <path id="leftWingPath" d="M -32,-165 Q 35,-145 102,-158" stroke="#cbd5e1" stroke-width="20" stroke-linecap="round" fill="none" />
                        <path id="leftWingFeather" d="M -25,-160 Q 30,-135 88,-154" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" fill="none" />
                    </g>

                    <!-- 左腿与左脚掌（由JS逆向运动学IK实时驱动） -->
                    <g id="leftLegIK">
                        <!-- 左大腿 (雪白羽毛裤腿) -->
                        <line id="leftThigh" x1="-58" y1="-98" x2="-15" y2="-45" stroke="#cbd5e1" stroke-width="22" stroke-linecap="round" />
                        <!-- 左小腿 (橘黄鸟腿) -->
                        <line id="leftShin" x1="-15" y1="-45" x2="-5" y2="25" stroke="#d97706" stroke-width="10" stroke-linecap="round" />
                        <!-- 左脚蹼 -->
                        <path id="leftFoot" d="M -12,25 L 24,28 L 16,16 Z" fill="#d97706" stroke="#b45309" stroke-width="2" stroke-linejoin="round" />
                        <!-- 远端左踏板曲柄 -->
                        <line id="leftCrank" x1="-10" y1="20" x2="-10" y2="20" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
                        <rect id="leftPedal" x="-24" y="15" width="28" height="9" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
                    </g>

                    <!-- ======== B. 自行车前后车轮 ======== -->
                    <!-- 后轮中心 (-135, 25)，半径 76 -->
                    <g id="rearWheelGroup" transform="translate(-135, 25)">
                        <g id="rearWheelSpin">
                            <!-- 外胎与复古白边胎壁 -->
                            <circle r="76" fill="none" stroke="#1e293b" stroke-width="15" />
                            <circle r="66" fill="none" stroke="#fef3c7" stroke-width="5" />
                            <circle r="62" fill="none" stroke="#0d9488" stroke-width="4" />
                            <!-- 辐条 (12根交错) -->
                            <g stroke="#cbd5e1" stroke-width="2">
                                <line x1="-60" y1="0" x2="60" y2="0" />
                                <line x1="0" y1="-60" x2="0" y2="60" />
                                <line x1="-42" y1="-42" x2="42" y2="42" />
                                <line x1="-42" y1="42" x2="42" y2="-42" />
                                <line x1="-52" y1="-30" x2="52" y2="30" />
                                <line x1="-30" y1="-52" x2="30" y2="52" />
                                <line x1="-52" y1="30" x2="52" y2="-30" />
                                <line x1="-30" y1="52" x2="30" y2="-52" />
                            </g>
                            <!-- 气门嘴与反光片（凸显旋转感） -->
                            <rect x="36" y="-5" width="14" height="10" rx="5" fill="#f59e0b" />
                            <line x1="0" y1="-60" x2="0" y2="-51" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
                        </g>
                        <!-- 后花鼓 -->
                        <circle r="12" fill="#475569" stroke="#e2e8f0" stroke-width="3" />
                    </g>

                    <!-- 前轮中心 (145, 25)，半径 76 -->
                    <g id="frontWheelGroup" transform="translate(145, 25)">
                        <g id="frontWheelSpin">
                            <!-- 外胎与复古白边胎壁 -->
                            <circle r="76" fill="none" stroke="#1e293b" stroke-width="15" />
                            <circle r="66" fill="none" stroke="#fef3c7" stroke-width="5" />
                            <circle r="62" fill="none" stroke="#0d9488" stroke-width="4" />
                            <!-- 辐条 -->
                            <g stroke="#cbd5e1" stroke-width="2">
                                <line x1="-60" y1="0" x2="60" y2="0" />
                                <line x1="0" y1="-60" x2="0" y2="60" />
                                <line x1="-42" y1="-42" x2="42" y2="42" />
                                <line x1="-42" y1="42" x2="42" y2="-42" />
                                <line x1="-52" y1="-30" x2="52" y2="30" />
                                <line x1="-30" y1="-52" x2="30" y2="52" />
                                <line x1="-52" y1="30" x2="52" y2="-30" />
                                <line x1="-30" y1="52" x2="30" y2="-52" />
                            </g>
                            <!-- 琥珀色反光片与气门嘴 -->
                            <rect x="-50" y="-5" width="14" height="10" rx="5" fill="#f59e0b" />
                            <line x1="0" y1="60" x2="0" y2="51" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
                        </g>
                        <!-- 前花鼓 -->
                        <circle r="11" fill="#475569" stroke="#e2e8f0" stroke-width="3" />
                    </g>

                    <!-- ======== C. 自行车车架、挡泥板、链条传动系统 ======== -->
                    <!-- 前后复古挡泥板 -->
                    <path d="M -218,22 A 84,84 0 0 1 -68,-28" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />
                    <path d="M 72,-22 A 84,84 0 0 1 222,12" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" />

                    <!-- 后货架与小红旗 -->
                    <path d="M -135,25 L -108,-55 L -65,-55" fill="none" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
                    <!-- 货架上的小木桶 -->
                    <rect x="-132" y="-82" width="38" height="26" rx="5" fill="#b45309" stroke="#78350f" stroke-width="2" />

    <script>

        const state = {
            speedMultiplier: 1.0,
            targetSpeed: 1.0,
            pedalAngle: 0,          // 踏板旋转弧度
            wheelAngle: 0,          // 车轮旋转角度(deg)
            chainOffset: 0,         // 链条流动偏移
            roadScroll: 0,          // 地面滚动距离
            wavePhase: 0,           // 海浪相位
            fishCount: 2,           // 喉囊内小鱼数量
            xrayPouch: false,       // 是否开启喉囊高透视
            theme: 'day',           // 'day' | 'sunset' | 'night'
            beakOpenAmount: 0,      // 嘴巴张开程度 (0~1)
            pouchBounceVel: 0,      // 喉囊额外弹跳速度
            pouchBounceOffset: 0,   // 喉囊额外弹跳位移
            blinkTimer: 0           // 眨眼计时器
        };

        // 骨骼几何常量（基于 pelicanBikeRig 局部坐标系）
        const RIG_CONFIG = {
            crankCenter: { x: -10, y: 20 },
            crankRadius: 24,
            thighLength: 62,
            shinLength: 68,
            baseHip: { x: -56, y: -98 }
        };

        let audioCtx = null;
        function ensureAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 清脆自行车车铃声 + 鹈鹕欢快鸣叫合成
        function playBellSound() {
            try {
                ensureAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                [1567.98, 2093.0].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.09);
                    gain.gain.setValueAtTime(0.22, now + idx * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.65);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.09);
                    osc.stop(now + idx * 0.09 + 0.68);
                });
            } catch (e) {
                // 忽略音频上下文受限错误
            }
        }

        // 投喂小鱼落入大喉囊的Q弹音效
        function playGulpSound() {
            try {
                ensureAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(520, now + 0.14);
                osc.frequency.exponentialRampToValueAtTime(190, now + 0.28);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.32);
            } catch (e) {
                // 忽略音频上下文受限错误
            }
        }

        const treesLayer = document.getElementById('sceneryTreesLayer');
        const fenceLayer = document.getElementById('boardwalkFenceLayer');
        const roadMarkingsLayer = document.getElementById('roadMarkingsLayer');

        const palmTrees = [
            { x: 150, scale: 0.95, lean: -12 },
            { x: 540, scale: 0.8, lean: 8 },
            { x: 960, scale: 1.05, lean: -6 }
        ];

        const fencePosts = [];
        for (let i = 0; i < 16; i++) {
            fencePosts.push({ x: i * 85 });
        }

        const roadStripes = [];
        for (let i = 0; i < 12; i++) {
            roadStripes.push({ x: i * 120 });
        }

        function initBackgroundElements() {
            // 初始化棕榈树
            treesLayer.innerHTML = palmTrees.map((t, idx) => `
                <g id="palmTree_${idx}" transform="translate(${t.x}, 480) scale(${t.scale})">
                    <!-- 树干 -->
                    <path d="M -8,0 Q ${t.lean},-55 ${t.lean * 1.6},-118 L ${t.lean * 1.6 + 8},-118 Q ${t.lean + 10},-55 8,0 Z" fill="#92400e" />
                    <!-- 椰子 -->
                    <circle cx="${t.lean * 1.6}" cy="-114" r="6" fill="#451a03" />
                    <circle cx="${t.lean * 1.6 + 8}" cy="-112" r="5.5" fill="#451a03" />
                    <!-- 树叶 -->
                    <g transform="translate(${t.lean * 1.6 + 4}, -118)" fill="#15803d">
                        <path d="M 0,0 Q -45,-28 -78,6 Q -38,-6 0,0 Z" />
                        <path d="M 0,0 Q -32,-48 -58,-32 Q -25,-22 0,0 Z" fill="#16a34a" />
                        <path d="M 0,0 Q 45,-28 78,6 Q 38,-6 0,0 Z" />
                        <path d="M 0,0 Q 32,-48 58,-32 Q 25,-22 0,0 Z" fill="#16a34a" />
                        <path d="M 0,0 Q 0,-55 24,-52 Q 8,-25 0,0 Z" fill="#22c55e" />
                    </g>
                    <!-- 树根草丛 -->
                    <path d="M -22,2 Q -10,-16 0,2 Q 12,-14 24,2 Z" fill="#15803d" />
                </g>
            `).join('');

        /**
         * 求解二连杆逆向运动学（髋关节 -> 膝关节 -> 脚踝/踏板）
         * 确保鹈鹕骑行时膝盖始终自然向前弯曲
         */
        function solveTwoBoneIK(hipX, hipY, targetX, targetY, L1, L2) {
            const dx = targetX - hipX;
            const dy = targetY - hipY;
            let dist = Math.hypot(dx, dy);

            // 防止超出最大伸展距离
            const maxReach = (L1 + L2) * 0.995;
            const minReach = Math.abs(L1 - L2) + 2;
            dist = Math.max(minReach, Math.min(maxReach, dist));

            // 余弦定理求髋部夹角
            const cosAngleHip = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
            const clampedCos = Math.max(-1, Math.min(1, cosAngleHip));
            const angleHip = Math.acos(clampedCos);

            // 基准角（从髋部指向踏板）
            const baseAngle = Math.atan2(dy, dx);
            // 鹈鹕朝右骑行，膝盖向右侧（角度减小方向）弯曲
            const femurAngle = baseAngle - angleHip;

            return {
                kneeX: hipX + Math.cos(femurAngle) * L1,
                kneeY: hipY + Math.sin(femurAngle) * L1
            };
        }

        let lastTime = performance.now();
        let lighthouseX = 820;
        let sailboatX = 320;
        const cloudElements = Array.from(document.querySelectorAll('.cloud-item'));

        function animate(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            // 1. 平滑插值当前速度
            state.speedMultiplier += (state.targetSpeed - state.speedMultiplier) * 0.08;
            const spd = state.speedMultiplier;

            // 2. 更新踏频角度、车轮转角与链条偏移
            const angularVel = spd * 4.8; // rad/s
            state.pedalAngle = (state.pedalAngle + angularVel * dt) % (Math.PI * 2);
            state.wheelAngle = (state.wheelAngle + spd * 290 * dt) % 360;
            state.chainOffset = (state.chainOffset - spd * 85 * dt) % 10;
            state.wavePhase += dt * 2.5;

            // 旋转前后轮与牙盘
            dom.rearWheelSpin.setAttribute('transform', `rotate(${state.wheelAngle})`);
            dom.frontWheelSpin.setAttribute('transform', `rotate(${state.wheelAngle})`);
            dom.chainringSpin.setAttribute('transform', `translate(-10, 20) rotate(${(state.pedalAngle * 180) / Math.PI})`);
            dom.bikeChainPath.setAttribute('stroke-dashoffset', state.chainOffset);

            // 3. 计算鹈鹕身体双倍频律动（左脚与右脚各踩下一次，身体就起伏一次）
            const rhythm2x = state.pedalAngle * 2;
            const bodyBobY = Math.sin(rhythm2x) * 6.5 * Math.min(1.4, spd + 0.15);
            const bodyPitch = Math.cos(rhythm2x) * 2.2 * Math.min(1.4, spd) + spd * 2.8;
            const chassisBounceY = Math.sin(rhythm2x - 0.5) * 1.8 * Math.min(1.5, spd);

            dom.bikeChassisGroup.setAttribute('transform', `translate(0, ${chassisBounceY}) rotate(${spd > 1.8 ? 1.2 : 0})`);
            dom.groundShadow.setAttribute('rx', (185 - bodyBobY * 1.2).toFixed(1));

            // 鹈鹕躯干位置与俯仰
            const currentHipX = RIG_CONFIG.baseHip.x;
            const currentHipY = RIG_CONFIG.baseHip.y + bodyBobY;
            dom.pelicanBodyGroup.setAttribute(
                'transform',
                `translate(${currentHipX}, ${currentHipY - 27}) rotate(${bodyPitch})`
            );

            // 脖颈与头部的反向稳定补偿（鸟类头部防抖特性 + 随节奏轻点）
            const headNod = -bodyPitch * 0.65 + Math.sin(rhythm2x - 0.8) * 3.2;
            dom.pelicanHeadGroup.setAttribute('transform', `translate(20, -96) rotate(${headNod})`);

            // 尾羽与围巾随风飘动
            const tailWag = Math.sin(rhythm2x + 0.6) * 8;
            dom.pelicanTailGroup.setAttribute('transform', `translate(-44, 10) rotate(${tailWag})`);

            const windWave1 = Math.sin(now * 0.012 * Math.max(0.5, spd)) * (6 + spd * 5);
            const windWave2 = Math.cos(now * 0.015 * Math.max(0.5, spd)) * (8 + spd * 6);
            dom.scarfTail1.setAttribute('transform', `rotate(${windWave1})`);
            dom.scarfTail2.setAttribute('transform', `rotate(${windWave2})`);
            dom.crestFeathers.setAttribute('transform', `rotate(${windWave1 * 0.6})`);

            // 4. 大喉囊弹簧阻尼物理计算（随身体起伏 + 吞鱼弹跳 + 存鱼重量下垂）
            const springForce = -110 * state.pouchBounceOffset;
            const dampingForce = -8.5 * state.pouchBounceVel;
            const externalImpulse = Math.cos(rhythm2x) * 45 * spd;
            state.pouchBounceVel += (springForce + dampingForce + externalImpulse) * dt;
            state.pouchBounceOffset += state.pouchBounceVel * dt;

            const fishBellyWeight = Math.min(state.fishCount * 4.5, 28);
            const jiggleY = Math.max(-18, Math.min(35, state.pouchBounceOffset + fishBellyWeight));
            const jiggleX = Math.sin(rhythm2x - 0.6) * 5 * spd;

            const p1y = (90 + jiggleY * 1.15).toFixed(1);
            const p2y = (100 + jiggleY * 1.35).toFixed(1);
            const p1x = (28 + jiggleX).toFixed(1);
            const p2x = (142 + jiggleX * 0.7).toFixed(1);

            const dynamicPouchD = `M 0,0 C ${p1x},${p1y} ${p2x},${p2y} 168,5 C 110,12 50,8 0,0 Z`;
            dom.pouchMainPath.setAttribute('d', dynamicPouchD);
            dom.pouchClipPath.setAttribute('d', dynamicPouchD);
            dom.pouchCrease1.setAttribute('d', `M 18,8 C ${(40 + jiggleX * 0.6).toFixed(1)},${(58 + jiggleY * 0.85).toFixed(1)} 115,${(64 + jiggleY * 0.9).toFixed(1)} 148,7`);

            // 上喙张合过渡
            if (state.beakOpenAmount > 0.01) {
                state.beakOpenAmount = Math.max(0, state.beakOpenAmount - dt * 2.2);
            }
            const beakAngle = -state.beakOpenAmount * 22;
            dom.upperBeakGroup.setAttribute('transform', `translate(8, -4) rotate(${beakAngle})`);

            // 自然眨眼控制
            state.blinkTimer += dt;
            if (state.blinkTimer > 3.6) {
                dom.eyelid.setAttribute('d', 'M -9,-9 L 9,-9 L 9,9 L -9,9 Z');
                if (state.blinkTimer > 3.76) {
                    dom.eyelid.setAttribute('d', 'M -9,-9 L 9,-9 L 9,-9 L -9,-9 Z');
                    state.blinkTimer = 0;
                }
            }

            // 5. 计算右腿与左腿的精确 2D 逆向运动学（IK）
            const { crankCenter, crankRadius, thighLength, shinLength } = RIG_CONFIG;

            // --- 右腿 (近端，角度 state.pedalAngle) ---
            const rPedalX = crankCenter.x + Math.cos(state.pedalAngle) * crankRadius;
            const rPedalY = crankCenter.y + Math.sin(state.pedalAngle) * crankRadius;
            const rKnee = solveTwoBoneIK(currentHipX, currentHipY, rPedalX, rPedalY, thighLength, shinLength);

            dom.rightCrank.setAttribute('x2', rPedalX);
            dom.rightCrank.setAttribute('y2', rPedalY);
            dom.rightPedal.setAttribute('x', rPedalX - 15);
            dom.rightPedal.setAttribute('y', rPedalY - 5);

            dom.rightThigh.setAttribute('x1', currentHipX);
            dom.rightThigh.setAttribute('y1', currentHipY);
            dom.rightThigh.setAttribute('x2', rKnee.kneeX);
            dom.rightThigh.setAttribute('y2', rKnee.kneeY);

            dom.rightKneeJoint.setAttribute('cx', rKnee.kneeX);
            dom.rightKneeJoint.setAttribute('cy', rKnee.kneeY);

            dom.rightShin.setAttribute('x1', rKnee.kneeX);
            dom.rightShin.setAttribute('y1', rKnee.kneeY);
            dom.rightShin.setAttribute('x2', rPedalX);
            dom.rightShin.setAttribute('y2', rPedalY);

            const rFootRock = Math.sin(state.pedalAngle) * 8;
            dom.rightFoot.setAttribute(
                'd',
                `M ${rPedalX - 10},${rPedalY} L ${rPedalX + 28},${rPedalY + 4 + rFootRock * 0.3} L ${rPedalX + 18},${rPedalY - 10} Z`
            );

            // --- 左腿 (远端，相位差 PI) ---
            const lAngle = state.pedalAngle + Math.PI;
            const lPedalX = crankCenter.x + Math.cos(lAngle) * crankRadius;
            const lPedalY = crankCenter.y + Math.sin(lAngle) * crankRadius;
            const lKnee = solveTwoBoneIK(currentHipX + 4, currentHipY - 2, lPedalX, lPedalY, thighLength, shinLength);

            dom.leftCrank.setAttribute('x2', lPedalX);
            dom.leftCrank.setAttribute('y2', lPedalY);
            dom.leftPedal.setAttribute('x', lPedalX - 14);
            dom.leftPedal.setAttribute('y', lPedalY - 4);

            dom.leftThigh.setAttribute('x1', currentHipX + 4);
            dom.leftThigh.setAttribute('y1', currentHipY - 2);
            dom.leftThigh.setAttribute('x2', lKnee.kneeX);
            dom.leftThigh.setAttribute('y2', lKnee.kneeY);

            dom.leftShin.setAttribute('x1', lKnee.kneeX);
            dom.leftShin.setAttribute('y1', lKnee.kneeY);
            dom.leftShin.setAttribute('x2', lPedalX);
            dom.leftShin.setAttribute('y2', lPedalY);

            dom.leftFoot.setAttribute(
                'd',
                `M ${lPedalX - 10},${lPedalY} L ${lPedalX + 26},${lPedalY + 3} L ${lPedalX + 16},${lPedalY - 9} Z`
            );

            // --- 左右翅膀握车把自适应弯曲 ---
            const shoulderX = -38;
            const shoulderY = -142 + bodyBobY * 0.9;
            const elbowX = -2 + bodyBobY * 0.4;
            const elbowY = -108 + bodyBobY * 0.6;
            dom.rightWingUpper.setAttribute('d', `M ${shoulderX},${shoulderY} Q ${elbowX},${elbowY} 44,-159`);
            dom.rightWingFeathers.setAttribute('d', `M ${shoulderX + 6},${shoulderY + 5} Q ${elbowX + 4},${elbowY - 4} 38,-153`);
            dom.leftWingPath.setAttribute('d', `M ${shoulderX + 8},${shoulderY - 12} Q ${elbowX + 18},${elbowY - 22} 54,-164`);

            // 6. 视差背景多层移动更新
            // (a) 云朵极慢漂移
            cloudElements.forEach(cloud => {
                let cx = parseFloat(cloud.dataset.x);
                const cy = parseFloat(cloud.dataset.y);
                const cScale = parseFloat(cloud.dataset.scale);
                const cSpeed = parseFloat(cloud.dataset.speed);
                cx -= (12 + spd * 35) * cSpeed * dt;
                if (cx < -220) cx = 1280;
                cloud.dataset.x = cx;
                cloud.setAttribute('transform', `translate(${cx}, ${cy}) scale(${cScale})`);
            });

            // (b) 远景灯塔与帆船缓慢后移
            lighthouseX -= spd * 24 * dt;
            if (lighthouseX < -160) lighthouseX = 1320;
            dom.lighthouseGroup.setAttribute('transform', `translate(${lighthouseX}, 365)`);

            sailboatX -= spd * 42 * dt;
            if (sailboatX < -100) sailboatX = 1280;
            const boatBob = Math.sin(state.wavePhase * 1.3) * 3;
            const boatTilt = Math.cos(state.wavePhase * 1.3) * 2.5;
            dom.sailboatGroup.setAttribute('transform', `translate(${sailboatX}, ${392 + boatBob}) rotate(${boatTilt})`);

            // (c) 海浪动态摇曳
            const waveShift1 = (now * 0.04 * Math.max(0.4, spd)) % 60;
            const waveShift2 = (now * 0.06 * Math.max(0.4, spd)) % 60;
            dom.wavePath1.setAttribute('transform', `translate(${-waveShift1}, 0)`);
            dom.wavePath2.setAttribute('transform', `translate(${-waveShift2}, 0)`);

            // (d) 中景棕榈树与护栏移动
            palmTrees.forEach((tree, idx) => {
                tree.x -= spd * 145 * dt;
                if (tree.x < -140) tree.x = 1320;
                const el = document.getElementById(`palmTree_${idx}`);
                if (el) {
                    el.setAttribute('transform', `translate(${tree.x}, 480) scale(${tree.scale})`);
                }
            });

            fencePosts.forEach((post, idx) => {
                post.x -= spd * 220 * dt;
                if (post.x < -40) post.x += 16 * 85;
                const el = document.getElementById(`fencePost_${idx}`);
                if (el) {
                    el.setAttribute('x', post.x);
                }
            });

            // (e) 前景公路标线高速后掠
            roadStripes.forEach((stripe, idx) => {
                stripe.x -= spd * 390 * dt;
                if (stripe.x < -120) stripe.x += 12 * 120;
                const el = document.getElementById(`roadStripe_${idx}`);
                if (el) {
                    el.setAttribute('transform', `translate(${stripe.x}, 0)`);
                }
            });

            // 7. 更新空中投喂小鱼的抛物线轨迹（精确飞入鹈鹕张开的大喉囊）
            const targetMouthX = 560 + 58;
            const targetMouthY = 455 - 245 + bodyBobY;

            for (let i = activeFlyingFish.length - 1; i >= 0; i--) {
                const f = activeFlyingFish[i];
                f.progress += dt * 1.55;
                const t = Math.min(1, f.progress);

                // 二次贝塞尔抛物线插值
                const ctrlX = (f.startX + targetMouthX) * 0.5;
                const ctrlY = Math.min(f.startY, targetMouthY) - 170;

                const curX = (1 - t) * (1 - t) * f.startX + 2 * (1 - t) * t * ctrlX + t * t * targetMouthX;
                const curY = (1 - t) * (1 - t) * f.startY + 2 * (1 - t) * t * ctrlY + t * t * targetMouthY;

                // 计算切线角度让小鱼头朝飞行方向
                const tx = 2 * (1 - t) * (ctrlX - f.startX) + 2 * t * (targetMouthX - ctrlX);
                const ty = 2 * (1 - t) * (ctrlY - f.startY) + 2 * t * (targetMouthY - ctrlY);
                const angleDeg = (Math.atan2(ty, tx) * 180) / Math.PI;

                f.el.setAttribute('transform', `translate(${curX}, ${curY}) rotate(${angleDeg})`);

                if (t >= 1) {
                    // 小鱼落入喉囊！触发喉囊Q弹下沉与音效
                    f.el.remove();
                    activeFlyingFish.splice(i, 1);
                    state.fishCount++;
                    state.pouchBounceVel += 180;
                    state.beakOpenAmount = 0.25;
                    playGulpSound();
                    dom.fishCountReadout.textContent = state.fishCount;
                }
            }

            // 8. 高速骑行时的风线特效
            if (spd > 1.55) {
                const windAlpha = Math.min(0.85, (spd - 1.5) * 0.7);
                const offsetW = (now * 0.8) % 90;
                dom.windAndDustLayer.innerHTML = `
                    <line x1="${-240 - offsetW}" y1="-190" x2="${-150 - offsetW}" y2="-190" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" opacity="${windAlpha}" />
                    <line x1="${-280 - offsetW * 0.7}" y1="-95" x2="${-180 - offsetW * 0.7}" y2="-95" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" opacity="${windAlpha}" />
                    <line x1="${-260 - offsetW * 1.1}" y1="35" x2="${-190 - offsetW * 1.1}" y2="35" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" opacity="${windAlpha}" />
                `;
            } else if (dom.windAndDustLayer.innerHTML !== '') {
                dom.windAndDustLayer.innerHTML = '';
            }

            // 9. 更新顶部仪表盘数据
            dom.speedReadout.textContent = (spd * 18.5).toFixed(1);
            dom.rpmReadout.textContent = Math.round(spd * 72);

            requestAnimationFrame(animate);
        }

        function bindEventListeners() {
            const speedSlider = document.getElementById('speedSlider');
            speedSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                state.targetSpeed = val;

                if (val === 0) {
                    dom.speedModeBadge.textContent = '驻车休息';
                    dom.speedModeBadge.className = 'px-2.5 py-0.5 rounded-full text-xs bg-slate-600/40 text-slate-300 border border-slate-500/30';
                } else if (val < 0.8) {
                    dom.speedModeBadge.textContent = '慢速看海';
                    dom.speedModeBadge.className = 'px-2.5 py-0.5 rounded-full text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-400/30';
                } else if (val <= 1.6) {
                    dom.speedModeBadge.textContent = '悠闲巡航';
                    dom.speedModeBadge.className = 'px-2.5 py-0.5 rounded-full text-xs bg-sky-500/20 text-sky-300 border border-sky-400/30';
                } else {
                    dom.speedModeBadge.textContent = '破风冲刺 🔥';
                    dom.speedModeBadge.className = 'px-2.5 py-0.5 rounded-full text-xs bg-rose-500/20 text-rose-300 border border-rose-400/30';
                }
            });

            // 投喂小鱼按钮
            document.getElementById('feedFishBtn').addEventListener('click', () => {
                spawnFlyingFish(1120, 160 + Math.random() * 140);
            });

            // 点击SVG画布任意位置也可从点击处抛投小鱼
            const sceneSvg = document.getElementById('sceneSvg');
            sceneSvg.addEventListener('click', (e) => {
                const pt = sceneSvg.createSVGPoint();
                pt.x = e.clientX;
                pt.y = e.clientY;
                const svgP = pt.matrixTransform(sceneSvg.getScreenCTM().inverse());
                spawnFlyingFish(svgP.x, svgP.y);
            });

            // 按响车铃按钮
            document.getElementById('ringBellBtn').addEventListener('click', () => {
                triggerBikeBell();
            });

            // 喉囊透视开关
            const xrayBtn = document.getElementById('xrayToggleBtn');
            xrayBtn.addEventListener('click', () => {
                state.xrayPouch = !state.xrayPouch;
                dom.pouchFishInside.setAttribute('opacity', state.xrayPouch ? '0.92' : '0.42');
                xrayBtn.classList.toggle('bg-amber-500', state.xrayPouch);
                xrayBtn.classList.toggle('text-slate-950', state.xrayPouch);
                xrayBtn.classList.toggle('bg-slate-700', !state.xrayPouch);
                xrayBtn.classList.toggle('text-slate-200', !state.xrayPouch);
            });

            // 昼夜主题切换按钮
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    applyTheme(btn.dataset.theme);
                });
            });

            // 5秒后淡化顶部操作提示条
            setTimeout(() => {
                const banner = document.getElementById('toastBanner');
                if (banner) banner.style.opacity = '0';
            }, 5500);
        }

        window.onload = function () {
            initBackgroundElements();
            bindEventListeners();
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
