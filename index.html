<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<title>hunluanzhizhu — 个人静态项目合集</title>
<meta name="description" content="个人静态网页项目合集：浏览器实验与游戏。">
<style>
  /* ============ 设计令牌 ============ */
  :root{
    --bg:#0a0a0a;
    --bg-2:#0f0f0f;
    --ink:#e8e8e8;
    --ink-dim:#7a7a7a;
    --ink-faint:#3a3a3a;
    --line:#1f1f1f;
    --line-2:#2a2a2a;
    --acid:#c6ff00;
    --acid-dim:rgba(198,255,0,.16);
    --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,'Cascadia Code','Liberation Mono',Menlo,Consolas,monospace;
    --pad:clamp(20px,5vw,72px);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{
    font-family:var(--mono);
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    line-height:1.5;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 背景：点阵 + 网格 + 噪点 ============ */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      radial-gradient(circle at center, rgba(255,255,255,.045) 1px, transparent 1.4px);
    background-size:26px 26px;
    background-position:0 0;
    animation:drift 32s linear infinite;
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size:80px 80px;
    mask-image:radial-gradient(ellipse at 50% 30%, #000 0%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%, #000 0%, transparent 75%);
  }
  @keyframes drift{to{background-position:26px 26px}}

  /* 顶部一道 acid 光带 */
  .topbeam{
    position:fixed;top:0;left:0;right:0;height:2px;z-index:50;
    background:linear-gradient(90deg, transparent 0%, var(--acid) 12%, var(--acid) 88%, transparent 100%);
    opacity:.55;
    box-shadow:0 0 14px var(--acid-dim);
  }

  /* ============ 布局容器 ============ */
  .shell{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 var(--pad)}

  /* ============ 顶栏 ============ */
  header.bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 0 18px;
    border-bottom:1px solid var(--line);
    opacity:0;transform:translateY(-8px);
    animation:rise .6s .05s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .brand{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.04em}
  .brand .mark{color:var(--acid);font-weight:700;letter-spacing:.1em}
  .brand .slash{color:var(--ink-faint)}
  .brand .name{color:var(--ink-dim)}

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.16em;color:var(--acid);
    border:1px solid var(--acid);padding:5px 11px;
    text-transform:uppercase;
    animation:pulse 2.4s ease-in-out infinite;
  }
  .badge .dot{width:6px;height:6px;background:var(--acid);box-shadow:0 0 8px var(--acid)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--acid-dim)}50%{box-shadow:0 0 0 5px transparent}}

  /* ============ Hero ============ */
  .hero{padding:clamp(48px,9vw,96px) 0 clamp(40px,6vw,64px)}
  .hero h1{
    font-size:clamp(30px,6.4vw,76px);
    font-weight:800;line-height:1.02;letter-spacing:-.02em;
    color:var(--ink);
    opacity:0;transform:translateY(14px);
    animation:rise .7s .18s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .hero h1 .prompt{color:var(--acid);font-weight:700}
  .hero h1 .cursor{
    display:inline-block;width:.5ch;background:var(--acid);color:transparent;
    animation:blink 1.1s steps(1) infinite;margin-left:2px;
  }
  @keyframes blink{50%{opacity:0}}
  .hero p{
    margin-top:18px;max-width:52ch;font-size:clamp(13px,1.4vw,16px);
    color:var(--ink-dim);letter-spacing:.02em;
    opacity:0;transform:translateY(10px);
    animation:rise .7s .3s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .hero p .hl{color:var(--ink)}

  /* ============ 区块标题 ============ */
  .sec-head{
    display:flex;align-items:center;gap:14px;
    margin:8px 0 28px;
    opacity:0;transform:translateY(10px);
    animation:rise .6s .42s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .sec-head .bar-v{width:4px;height:18px;background:var(--acid);box-shadow:0 0 10px var(--acid-dim)}
  .sec-head h2{font-size:13px;letter-spacing:.28em;color:var(--ink);font-weight:700;text-transform:uppercase}
  .sec-head .rule{flex:1;height:1px;background:var(--line)}
  .sec-head .count{font-size:11px;color:var(--ink-faint);letter-spacing:.1em}

  /* ============ 项目网格 ============ */
  .grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:18px;
    margin-bottom:72px;
  }
  @media(max-width:640px){.grid{grid-template-columns:1fr}}

  /* ---- 卡片 ---- */
  .card{
    position:relative;display:block;text-decoration:none;color:inherit;
    background:var(--bg-2);
    border:1px solid var(--line-2);
    padding:26px 26px 22px;
    min-height:300px;
    display:flex;flex-direction:column;
    transition:transform .28s cubic-bezier(.2,.7,.2,1), border-color .28s, box-shadow .28s;
    opacity:0;transform:translateY(20px);
    animation:rise .65s cubic-bezier(.2,.7,.2,1) forwards;
  }
  .card:nth-child(1){animation-delay:.52s}
  .card:nth-child(2){animation-delay:.64s}
  .card:nth-child(3){animation-delay:.76s}
  .card:nth-child(4){animation-delay:.88s}

  /* 左侧色条：默认短，hover 延伸 */
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--acid);
    transform:scaleY(.18);transform-origin:top;
    transition:transform .32s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover{
    border-color:var(--acid);
    transform:translate(-3px,-3px);
    box-shadow:3px 3px 0 0 var(--acid-dim), 6px 6px 24px rgba(0,0,0,.5);
  }
  .card:hover::before{transform:scaleY(1)}
  .card:focus-visible{outline:2px solid var(--acid);outline-offset:3px}

  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
  .card-num{font-size:13px;color:var(--acid);letter-spacing:.12em;font-weight:700}
  .card-tag{font-size:10px;color:var(--ink-faint);letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--line-2);padding:3px 7px}

  .card-title{
    font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.01em;
    color:var(--ink);line-height:1.1;margin-bottom:10px;
    transition:color .28s;
  }
  .card:hover .card-title{color:var(--acid)}
  .card-rule{width:42px;height:2px;background:var(--line-2);margin-bottom:16px;transition:width .32s,background .28s}
  .card:hover .card-rule{width:72px;background:var(--acid)}

  .card-stack{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .chip{font-size:10px;letter-spacing:.1em;color:var(--ink-dim);border:1px solid var(--line-2);padding:3px 8px;text-transform:lowercase}
  .chip::before{content:"//";color:var(--ink-faint);margin-right:4px}

  .card-desc{font-size:13px;color:var(--ink-dim);line-height:1.65;flex:1;letter-spacing:.01em}

  .card-cta{
    margin-top:22px;display:inline-flex;align-items:center;gap:10px;
    font-size:12px;letter-spacing:.18em;color:var(--ink);text-transform:uppercase;font-weight:700;
    border-top:1px solid var(--line-2);padding-top:16px;
    transition:color .28s;
  }
  .card-cta .arrow{display:inline-block;transition:transform .28s,color .28s}
  .card:hover .card-cta{color:var(--acid)}
  .card:hover .card-cta .arrow{transform:translateX(6px);color:var(--acid)}

  /* ============ 页脚 ============ */
  footer{
    border-top:1px solid var(--line);
    padding:24px 0 36px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    font-size:11px;color:var(--ink-faint);letter-spacing:.1em;
    opacity:0;transform:translateY(8px);
    animation:rise .6s 1s cubic-bezier(.2,.7,.2,1) forwards;
  }
  footer .git{color:var(--ink-dim);text-decoration:none;border-bottom:1px solid var(--line-2);transition:color .2s,border-color .2s}
  footer .git:hover{color:var(--acid);border-color:var(--acid)}

  /* ============ 语言切换 ============ */
  .lang{
    display:inline-flex;align-items:center;border:1px solid var(--line-2);
    font-size:11px;letter-spacing:.1em;
  }
  .lang button{
    background:none;border:none;color:var(--ink-faint);font:inherit;
    padding:5px 10px;cursor:pointer;letter-spacing:.08em;
    transition:color .2s,background .2s;
  }
  .lang button:hover{color:var(--ink)}
  .lang button[aria-pressed="true"]{color:var(--acid);background:var(--acid-dim)}
  .lang .sep{color:var(--ink-faint);user-select:none}

  /* ============ 入场关键帧 ============ */
  @keyframes rise{to{opacity:1;transform:translateY(0)}}

  /* 尊重 reduced-motion */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;opacity:1 !important;transform:none !important}
  }
</style>
</head>
<body>
<div class="topbeam"></div>

<div class="shell">

  <!-- 顶栏 -->
  <header class="bar">
    <div class="brand">
      <span class="mark">███</span>
      <span class="name">hunluanzhizhu<span class="slash">.github.io</span></span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="badge"><span class="dot"></span><span id="count">2</span> <span data-i18n="projects_label">PROJECTS</span></span>
      <span class="lang" role="group" aria-label="language">
        <button id="lang-zh" aria-pressed="true" type="button">ZH</button>
        <span class="sep">/</span>
        <button id="lang-en" aria-pressed="false" type="button">EN</button>
      </span>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1><span class="prompt">&gt;</span> PERSONAL.STATIC<br>COLLECTION<span class="cursor">_</span></h1>
    <p data-i18n="hero_desc"></p>
  </section>

  <!-- 项目区块 -->
  <div class="sec-head">
    <span class="bar-v"></span>
    <h2 data-i18n="projects">Projects</h2>
    <span class="rule"></span>
    <span class="count" id="count2">/ 02</span>
  </div>

  <main class="grid" id="grid"></main>

  <!-- 页脚 -->
  <footer>
    <span data-i18n="footer"></span>
    <a class="git" href="https://github.com/hunluanzhizhu" target="_blank" rel="noopener">github.com/hunluanzhizhu →</a>
  </footer>

</div>

<script>
  // ============ 项目数据（新增子项目只需在此追加一条） ============
  // descZh / descEn 为卡片描述的双语文案；标题、tag、stack 保持英文标识符
  const projects = [
    {
      id:'01',
      slug:'minecraft-web',
      title:'MINECRAFT WEB',
      tag:'3D · SANDBOX',
      stack:['rust','bevy','wasm'],
      descZh:'一个在浏览器中运行的体素沙盒世界，由 Rust + Bevy 编译为 WebAssembly 驱动。',
      descEn:'A voxel sandbox running in-browser via WebAssembly, powered by Rust + Bevy.'
    },
    {
      id:'02',
      slug:'neon-pulse',
      title:'NEON PULSE',
      tag:'ARCADE',
      stack:['canvas','arcade'],
      descZh:'实验性质的小游戏，也是最初用来测试 GitHub Pages 的项目。闪避光墙、累积连击，在不断加速的霓虹航道中冲击最高分。',
      descEn:'An experimental mini-game — also the very first project used to test GitHub Pages. Dodge light walls, build combos in an accelerating neon corridor.'
    },
    {
      id:'03',
      slug:'group-meeting-eml',
      title:'EML ELEMENTARY TALK',
      tag:'SLIDES · TALK',
      stack:['slides','katex','webgl'],
      descZh:'EML 单算子重构全部初等函数 —— 组会汇报，横向翻页网页 PPT。',
      descEn:'Reconstructing all elementary functions with a single EML operator — group meeting talk, horizontal swipe web deck.'
    },
    {
      id:'04',
      slug:'guon-paper',
      title:'GUON OPTIMIZER',
      tag:'PAPER · HUMOR',
      stack:['llm','optimizer','satire'],
      descZh:'VRAM 太贵所以用研究生训练 LLM —— GUON 无状态二阶优化器，发表于 JokerofAcademics。',
      descEn:'VRAM is too expensive so we use graduate students to train LLMs — GUON, a stateless second-order optimizer. Published in JokerofAcademics.'
    },
    {
      id:'05',
      slug:'ecg-ai-local',
      title:'ECG AI LOCAL',
      tag:'AI · HEALTH',
      stack:['tfjs','snn','local-ai'],
      descZh:'心韵深辨 —— 由微信小程序完整转化的本地AI心电检测应用，浏览器内 TensorFlow.js 推理，9 个页面完整复刻。',
      descEn:'Xin Yun Shen Bian — a WeChat mini-program fully converted to web. Local ECG detection with TensorFlow.js in-browser inference, all 9 pages replicated.'
    },
    {
      id:'06',
      slug:'liang-intensity-calibrator',
      title:'LIANG CALIBRATOR',
      tag:'AIGC · SCRUBBER',
      stack:['image2','h3-ai','video','canvas'],
      descZh:'AI 连续版滑动变祖器 —— 技术路线：OpenAI Image2 生成首尾帧 + MiniMax H3 FL2VA 连续插帧。滑杆 0-30 级逐帧连续进化，从「小难梁」一路到「梁祖」，241 帧全利用、零跳帧。',
      descEn:'AI continuous evolution scrubber — OpenAI Image2 anchor frames interpolated by MiniMax H3 FL2VA. A 0-30 level, frame-by-frame evolution from a beaten laoliang all the way to an emperor (241 frames, zero skip).'
    }
  ];

  // ============ i18n 文案字典 ============
  const I18N = {
    zh:{
      projects_label:'项目',
      hero_desc:'一个个人静态网页项目合集。<span class="hl">浏览器实验与游戏</span>，每个子项目独立文件夹，首页负责导航。全部纯前端，无框架、无构建。',
      projects:'项目',
      footer:'© 2026 · 由 html / css / js 构建 · 无框架',
      enter:'进入'
    },
    en:{
      projects_label:'PROJECTS',
      hero_desc:'A personal collection of static web projects. <span class="hl">Browser experiments & games</span>, each in its own folder, navigated from this home. Pure frontend, no frameworks, no build step.',
      projects:'Projects',
      footer:'© 2026 · built with html / css / js · no frameworks',
      enter:'ENTER'
    }
  };

  // ============ 语言状态 ============
  let lang = localStorage.getItem('lang') || 'zh';
  if(lang !== 'zh' && lang !== 'en') lang = 'zh';

  function applyLang(){
    const dict = I18N[lang];
    // 静态文案
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(dict[key] !== undefined) el.innerHTML = dict[key];
    });
    // 卡片描述
    document.querySelectorAll('.card-desc').forEach((el,i) => {
      if(projects[i]) el.textContent = projects[i]['desc' + lang.charAt(0).toUpperCase() + lang.slice(1)];
    });
    // 卡片 CTA
    document.querySelectorAll('.card-cta').forEach(el => {
      el.innerHTML = dict.enter + ' <span class="arrow">→</span>';
    });
    // 按钮状态
    document.getElementById('lang-zh').setAttribute('aria-pressed', lang === 'zh');
    document.getElementById('lang-en').setAttribute('aria-pressed', lang === 'en');
    // html lang 属性
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    localStorage.setItem('lang', lang);
  }

  document.getElementById('lang-zh').addEventListener('click', () => { lang='zh'; applyLang(); });
  document.getElementById('lang-en').addEventListener('click', () => { lang='en'; applyLang(); });

  // ============ 渲染卡片 ============
  const grid = document.getElementById('grid');
  const frag = document.createDocumentFragment();
  projects.forEach(p => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = 'projects/' + p.slug + '/';
    a.innerHTML =
      '<div class="card-top">' +
        '<span class="card-num">' + p.id + '</span>' +
        '<span class="card-tag">' + p.tag + '</span>' +
      '</div>' +
      '<h3 class="card-title">' + p.title + '</h3>' +
      '<div class="card-rule"></div>' +
      '<div class="card-stack">' +
        p.stack.map(s => '<span class="chip">' + s + '</span>').join('') +
      '</div>' +
      '<p class="card-desc">' + p['desc' + lang.charAt(0).toUpperCase() + lang.slice(1)] + '</p>' +
      '<span class="card-cta">' + I18N[lang].enter + ' <span class="arrow">→</span></span>';
    frag.appendChild(a);
  });
  grid.appendChild(frag);

  // 计数徽章同步
  const n = String(projects.length).padStart(2,'0');
  document.getElementById('count').textContent = n;
  document.getElementById('count2').textContent = '/ ' + n;

  // 应用初始语言
  applyLang();
</script>
</body>
</html>
